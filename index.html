<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="三島ポータル">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>三島ポータル</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="img/login-bg.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Outfit:wght@600;800&display=swap" media="print" onload="this.media='all'">
<script>
/* PCでは、MacBook 11インチ（表示領域 1366×670）を基準に、画面全体を同じ比率で拡大・縮小します（文字や絵はその大きさで描き直すので、ぼやけません） */
(function(){var d=document.documentElement;function fit(){var w=innerWidth,h=innerHeight;
var f=w>=1000&&h>=500&&matchMedia('(hover:hover) and (pointer:fine)').matches;d.classList.toggle('fit',f);
var s=f?Math.max(.6,Math.min(2.4,Math.min(w/1366,h/670))):1;d.style.setProperty('--s',s);
d.style.setProperty('--W',(w/s)+'px');d.style.setProperty('--H',(h/s)+'px');}
fit();addEventListener('resize',fit);})();
</script>
<style>
:root{
  --bg:#edf3fd;
  --surface:#ffffff;
  --surface-2:#f4f8fe;
  --ink:#1c2a3d;
  --ink-2:#56677f;
  --ink-3:#8a99ae;
  --line:#e3eaf4;
  --navy:#0b2457;
  --navy-2:#123a82;
  --blue:#1b73f0;
  --blue-deep:#1458c4;
  --blue-soft:#e6f0fd;
  --glow:rgba(80,165,255,.55);
  --green:#58b12f;
  --green-deep:#3d8a1c;
  --red:#ee3d4f;
  --radius-l:16px;
  --radius-m:12px;
  --shadow:0 1px 2px rgba(20,40,80,.05),0 8px 22px rgba(31,111,229,.08);
  --sidebar-w:210px;
  --num:'Outfit','Noto Sans JP',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:clip}
body{
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',Meiryo,system-ui,sans-serif;
  color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 85% 0%,#dbeaff 0,transparent 45%),linear-gradient(160deg,#f3f7ff,#e6efff);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ── レイアウト ── */
.app{display:flex;min-height:100vh;position:relative}
.content{flex:1;min-width:0;display:flex;flex-direction:column}

/* ── サイドバー ── */
.sidebar{width:var(--sidebar-w);flex-shrink:0;color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40;
  background:linear-gradient(180deg,#0b2457 0%,#0f2f6e 70%,#123a82 100%);padding:14px 12px 10px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.logo{display:flex;align-items:center;gap:9px;padding:0 6px 12px;flex-shrink:0}
.logo-mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:18px;
  background:linear-gradient(135deg,#3aa0ff,#1b5fd6);box-shadow:0 0 12px rgba(80,170,255,.8)}
.logo-mark.face{background-color:#fff;background-position:center;background-size:118%;background-repeat:no-repeat;font-size:0;box-shadow:0 0 0 2px #7cc4ff,0 0 12px rgba(80,170,255,.8)}
.logo-text{font-weight:900;font-size:15px;line-height:1.15}
.logo-text span{display:block;color:#7cc4ff}
.nav{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-link{display:flex;align-items:center;gap:11px;width:100%;height:29px;padding:0 10px;border-radius:8px;font-weight:700;font-size:12.5px;color:#e4ecf8;text-align:left;transition:background .15s}
.nav-link:hover{background:rgba(255,255,255,.08)}
.nav-link.active{height:36px;margin-bottom:6px;color:#fff;background:linear-gradient(90deg,#2b8cff,#1a62e0);box-shadow:0 0 0 1px rgba(140,210,255,.6),0 0 16px rgba(60,160,255,.7)}
.nav-ico{width:18px;text-align:center;font-size:13px}
.lock-now{flex-shrink:0;margin-top:6px;padding:7px 10px;border-radius:8px;font-size:11.5px;font-weight:700;color:#9fb3d3;text-align:left}
.lock-now:hover{color:#fff;background:rgba(255,255,255,.08)}
.sidebar-close{display:none}
.flyout{position:fixed;min-width:230px;max-width:300px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);
  box-shadow:0 14px 34px rgba(20,40,80,.22);padding:8px;display:none;z-index:80}
.flyout.open{display:block}
.flyout-title{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:4px 10px 6px}
.flyout a{display:block;padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:600}
.flyout a:hover{background:var(--blue-soft);color:var(--blue-deep)}
.fly-off{display:block;padding:7px 10px;font-size:12.5px;color:var(--ink-3);cursor:default}
.fly-off small{margin-left:6px;font-size:10px}
.fly-head{font-size:10.5px;font-weight:800;color:var(--blue);padding:7px 10px 3px;margin-top:2px;border-top:1px solid var(--line);letter-spacing:.04em}
.fly-head:nth-child(2){border-top:none;margin-top:0}
.nav-sep{height:1px;margin:4px 10px;background:rgba(255,255,255,.16)}

/* ── トップバー ── */
.topbar{height:58px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:30;
  background:linear-gradient(90deg,rgba(255,255,255,.92),rgba(242,247,255,.92));border-bottom:1px solid #dfe8f4;backdrop-filter:blur(8px);
  padding-top:env(safe-area-inset-top,0px);height:calc(58px + env(safe-area-inset-top,0px))}
.burger{display:none;width:38px;height:38px;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-size:19px;flex-shrink:0}
.search-wrap{flex:1;max-width:520px;position:relative;min-width:0}
.search{height:38px;border:1.5px solid #bcd6fb;border-radius:20px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 6px 0 15px}
.search svg{color:var(--ink);flex-shrink:0}
.search input{flex:1;border:none;outline:none;background:none;min-width:0;font-size:13px}
.search input::placeholder{color:var(--ink-3)}
.search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border-radius:var(--radius-m);box-shadow:0 14px 36px rgba(20,40,80,.2);
  max-height:380px;overflow-y:auto;display:none;padding:6px;z-index:90}
.search-results.open{display:block}
.sr-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;width:100%;text-align:left}
.sr-item:hover,.sr-item.focus{background:var(--blue-soft)}
.sr-kind{font-size:10.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:2px 7px;border-radius:5px;flex-shrink:0}
.sr-name{font-weight:700;font-size:13px}
.sr-sub{font-size:11px;color:var(--ink-3)}
.sr-off{opacity:.55;cursor:default}
.sr-empty{padding:14px;color:var(--ink-2);font-size:12.5px}
.tb-btn{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;padding:6px 8px;border-radius:9px;flex-shrink:0}
.tb-btn:hover{background:var(--blue-soft)}
.dd-wrap{position:relative;flex-shrink:0}
.dd{position:absolute;top:calc(100% + 8px);right:0;width:300px;background:#fff;border-radius:var(--radius-m);box-shadow:0 14px 36px rgba(20,40,80,.2);
  padding:8px;display:none;z-index:90}
.dd.left{left:0;right:auto}
.dd.open{display:block}
.dd-head{display:flex;align-items:center;padding:4px 8px 8px;font-size:12px;font-weight:700;color:var(--ink-3)}
.dd-head button{margin-left:auto;font-size:11.5px;color:var(--blue);font-weight:700}
.dd-list{max-height:340px;overflow-y:auto}
.dd-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;font-size:12.5px;font-weight:600;width:100%;text-align:left}
.dd-item:hover{background:var(--blue-soft)}
.dd-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-item small{color:var(--ink-3);font-size:10.5px;font-weight:500;flex-shrink:0}
.dd-empty{padding:12px 8px;color:var(--ink-2);font-size:12px}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink-2);font-size:12.5px;white-space:nowrap;flex-shrink:0}
.weather{display:flex;align-items:center;gap:5px}
.weather b,.clock{font-family:var(--num);font-size:17px;color:var(--ink)}
.st-sep{color:#cbd6e6}
.st-date{font-family:var(--num);font-weight:600}
.bell{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.bell:hover{background:var(--blue-soft)}
.bell i{position:absolute;top:2px;right:1px;background:var(--red);color:#fff;font-style:normal;font-size:9.5px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;display:grid;place-items:center;font-weight:700}
.bell i[hidden]{display:none}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2f86ef,#1a5fcc);display:grid;place-items:center;color:#fff;box-shadow:0 0 0 2px #fff,0 2px 8px rgba(27,115,240,.4)}

/* ── 電光掲示板 ── */
.ticker{flex:1;min-width:0;max-width:440px;height:34px;overflow:hidden;position:relative;border-radius:9px;
  background:linear-gradient(180deg,#0b2457,#123a82);box-shadow:inset 0 0 0 1.5px rgba(124,196,255,.5),0 0 10px rgba(60,160,255,.35)}
.ticker[hidden]{display:none}
.ticker-track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform;padding-left:100%;animation-duration:20s;
  color:#e8f4ff;font-weight:700;font-size:13px;text-shadow:0 0 6px rgba(124,196,255,.9);animation:tick linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker.fixed .ticker-track{animation:none;transform:none;left:0;right:0;padding-left:0;justify-content:center}
.ticker.fixed .ticker-track span{padding-right:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ticker.fixed .ticker-track.in{animation:tick-in .5s ease-out}
@keyframes tick-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ticker-track span{padding-right:56px}
.ticker-track span::before{content:"📢";margin-right:8px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* ── メイン ── */
main{flex:1;min-height:0;padding:14px 20px 16px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid #dbe7fb;border-radius:var(--radius-l);box-shadow:var(--shadow)}

/* よく使うメニュー（18個のボタン） */
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;flex-shrink:0}
.qbtn{position:relative;z-index:3;height:var(--qh,72px);display:flex;align-items:center;gap:11px;padding:0 12px;min-width:0;border-radius:14px;
  font-weight:800;font-size:13.5px;line-height:1.3;
  background:linear-gradient(180deg,#ffffff 0%,#f3f7fd 100%);border:1px solid #e2eaf5;
  box-shadow:0 3px 0 #d6e1ef,0 7px 14px rgba(31,80,160,.10),inset 0 1px 0 #fff,inset 0 -2px 4px rgba(31,80,160,.05);
  transition:transform .12s,box-shadow .12s}
.qbtn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #cdd9ea,0 10px 18px rgba(31,80,160,.14),inset 0 1px 0 #fff}
.qbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #d6e1ef,0 3px 8px rgba(31,80,160,.10),inset 0 1px 0 #fff}
.q-ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 0 0 1.5px rgba(80,160,255,.30),0 0 10px rgba(80,160,255,.22),inset 0 1px 0 #fff}
.q-ico svg{width:24px;height:24px}
.q-name{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.q-tag{position:absolute;top:6px;right:8px;font-size:9.5px;font-weight:700;color:var(--ink-3);background:var(--surface-2);padding:1px 6px;border-radius:5px}
.qbtn.is-off{cursor:default;opacity:.62}
.qbtn.is-off:hover,.qbtn.is-off:active{transform:none;box-shadow:0 3px 0 #d6e1ef,0 7px 14px rgba(31,80,160,.10),inset 0 1px 0 #fff}
.qbtn-empty{justify-content:center;background:rgba(255,255,255,.45);border:1.5px dashed #c3d2e8;box-shadow:none;color:var(--ink-3);font-size:12.5px;font-weight:700;cursor:default}
.qbtn-empty:hover,.qbtn-empty:active{transform:none;box-shadow:none}

/* 下段4枚 */
.panels{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.panels > .panel{display:flex;flex-direction:column;min-height:0;padding:12px 14px 14px}
.p-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-shrink:0}
.p-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15.5px;white-space:nowrap}
.p-title svg{color:var(--blue);width:21px;height:21px;flex-shrink:0}
.p-act{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue);white-space:nowrap;padding:2px 4px;border-radius:6px}
.p-act:hover{background:var(--blue-soft)}
.p-count{margin-left:auto;font-family:var(--num);font-size:15px;font-weight:800;white-space:nowrap}
.p-count.done{font-size:13px}
.p-count.done{color:var(--green)}
.p-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}

/* 毎日のタスク */
.bar{height:9px;background:#e6eefa;border-radius:6px;margin:0 0 6px;flex-shrink:0;overflow:hidden}
.bar div{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#7cc943,#3aa0ff);box-shadow:0 0 8px rgba(58,160,255,.6);transition:width .35s}
.check-row{display:flex;align-items:center;gap:10px;padding:6px 2px;border-top:1px solid var(--line);cursor:pointer;user-select:none;font-weight:700;font-size:12.5px}
.check-row input{position:absolute;opacity:0;pointer-events:none}
.box{width:19px;height:19px;border-radius:5px;border:2px solid #b8c6da;flex-shrink:0;display:grid;place-items:center;background:#fff;transition:all .15s}
.box svg{opacity:0;transform:scale(.6);transition:all .15s}
.check-row input:checked + .box{background:var(--green);border-color:var(--green)}
.check-row input:checked + .box svg{opacity:1;transform:scale(1)}
.check-row input:focus-visible + .box{outline:2.5px solid var(--blue);outline-offset:2px}
.check-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check-row input:checked ~ .check-text{color:var(--ink-3);text-decoration:line-through}
.check-time{font-family:var(--num);font-size:11px;color:var(--ink-3);font-weight:600}
.todo-del{width:20px;height:20px;border-radius:5px;color:var(--ink-3);font-size:11px;opacity:0;flex-shrink:0}
.check-row:hover .todo-del,.todo-del:focus-visible{opacity:1}
.todo-del:hover{color:var(--red);background:#fde8ec}
.todo-form{display:flex;gap:6px;margin-top:8px;flex-shrink:0}
.todo-form input[type=text]{flex:1;min-width:0;height:32px;border:1px dashed #c3d2e8;border-radius:8px;padding:0 10px;font-size:12.5px;background:#fff}
.todo-form input[type=time]{width:68px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 4px;font-size:11.5px;background:#fff}
.todo-form input:focus{outline:none;border-color:var(--blue);border-style:solid}
.btn-add{height:32px;padding:0 13px;border-radius:8px;background:var(--green);color:#fff;font-weight:700;font-size:12px;box-shadow:0 2px 0 var(--green-deep),inset 0 1px 0 rgba(255,255,255,.3);flex-shrink:0}
.btn-add:hover{filter:brightness(1.05)}

/* いつものツール・ショートカット */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(38px,1fr));grid-auto-rows:minmax(38px,1fr);gap:8px;height:100%;padding:1px 1px 4px}
.tile{position:relative;display:flex;align-items:center;gap:8px;padding:0 9px;min-width:0;border-radius:11px;font-weight:700;font-size:12px;letter-spacing:-.01em;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 3px 0 rgba(31,60,120,.10),0 6px 12px rgba(31,80,160,.08),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 4px rgba(31,60,120,.05);transition:transform .12s}
.tile:hover{transform:translateY(-1px)}
.tile:active{transform:translateY(2px)}
.tile-ico{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.tile-name{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.tile-actions{position:absolute;top:3px;right:3px;display:none;gap:2px}
.tile:hover .tile-actions,.tile:focus-within .tile-actions{display:flex}
.tile-actions button{width:20px;height:20px;border-radius:5px;background:#fff;border:1px solid var(--line);font-size:10px;display:grid;place-items:center;color:var(--ink-2)}
.tile-actions button:hover{color:var(--red);border-color:var(--red)}
.tile-add{justify-content:center;background:#fff;border:1.5px dashed #c3d2e8;box-shadow:none;color:var(--blue)}
.empty-note{font-size:12px;color:var(--ink-2);padding:6px 2px}

/* 付箋メモ */
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(78px,1fr));grid-auto-rows:minmax(78px,1fr);gap:9px;height:100%;padding:2px 3px 6px}
.note{position:relative;border-radius:4px 4px 14px 4px;padding:7px 9px;font-size:11px;line-height:1.4;color:#3b4656;text-align:left;
  box-shadow:0 3px 8px rgba(30,40,60,.12);display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:transform .15s}
.note:hover{transform:rotate(0deg) translateY(-2px)!important}
.note b{font-size:12px;color:var(--ink);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note p{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;white-space:pre-wrap;word-break:break-all}
.note small{margin-top:auto;padding-top:2px;font-size:9.5px;color:#8a95a6}
.note-add{white-space:nowrap;padding:0 4px;border:1.5px dashed #c3d2e8;background:#fff;box-shadow:none;align-items:center;justify-content:center;color:var(--blue);font-weight:700;font-size:12px;border-radius:12px}
.c-yellow{background:#fff6c2}.c-pink{background:#ffe1ea}.c-blue{background:#dff1ff}.c-green{background:#e3f6e8}

/* ── モーダル ── */
.modal-bg{position:fixed;inset:0;background:rgba(15,28,52,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:var(--radius-l);width:100%;max-width:440px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:15.5px;font-weight:900}
.modal-x{margin-left:auto;width:30px;height:30px;border-radius:8px;font-size:15px;color:var(--ink-2)}
.modal-x:hover{background:var(--surface-2)}
.modal-body{padding:14px 18px;overflow-y:auto}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.btn{padding:8px 16px;border-radius:9px;font-weight:700;font-size:13px}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 2px 0 var(--blue-deep)}
.btn-primary:hover{background:var(--blue-deep)}
.btn-plain{background:var(--surface-2);color:var(--ink-2)}
.btn-danger{margin-right:auto;color:var(--red);background:#fde8ec}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.field-err{color:var(--red);font-size:12px;min-height:18px}
.colors{display:flex;gap:8px}
.colors label{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2px solid transparent;margin:0}
.colors input{position:absolute;opacity:0;pointer-events:none}
.colors input:checked + label{border-color:var(--blue);box-shadow:0 0 0 2px #fff inset}
.pick-group{font-size:11.5px;font-weight:700;color:var(--ink-3);margin:10px 0 4px}
.pick-group:first-child{margin-top:0}
.pick{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;cursor:pointer;font-weight:600;font-size:12.5px}
.pick:hover{border-color:var(--blue);background:var(--surface-2)}
.pick input{width:16px;height:16px;accent-color:var(--blue)}
.pick small{margin-left:auto;font-family:var(--num);color:var(--blue);font-weight:700}
.pick-note{font-size:12px;color:var(--ink-2);margin-bottom:10px}
.ann-item{padding:10px 2px;border-bottom:1px solid var(--line)}
.ann-item:last-child{border-bottom:none}
.ann-top{display:flex;align-items:center;gap:8px}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0}
.tag-notice{background:#fde8ec;color:var(--red)}
.tag-update{background:#e3f6ee;color:#16a36b}
.tag-system{background:var(--blue-soft);color:var(--blue)}
.ann-date{font-family:var(--num);font-size:11px;color:var(--ink-3);font-weight:600}
.ann-new{font-size:9.5px;font-weight:800;color:#fff;background:var(--red);padding:1px 6px;border-radius:5px}
.ann-title{font-weight:800;font-size:13.5px;margin-top:4px}
.ann-desc{font-size:12px;color:var(--ink-2);margin-top:2px}

.overlay{position:fixed;inset:0;background:rgba(15,28,52,.4);z-index:35;display:none}

/* ── キャラクターの紹介 ── */
.prof{position:fixed;inset:0;z-index:130;display:none;place-items:center;background:rgba(15,28,52,.5);padding:24px;cursor:pointer}
.prof.open{display:grid;animation:cele-fade .25s ease-out}
.prof img{max-width:min(46vw,560px);max-height:44vh;width:auto;height:auto;filter:drop-shadow(0 18px 40px rgba(0,0,0,.35));animation:cele-pop .4s cubic-bezier(.3,1.4,.5,1)}
.prof-hint{position:fixed;left:0;right:0;bottom:18px;text-align:center;color:#fff;font-weight:700;font-size:12.5px;opacity:.85;pointer-events:none}

/* ── タスクを全部終えたときのごほうび ── */
.cele{position:fixed;inset:0;z-index:120;display:none;place-items:center;background:rgba(15,28,52,.45);padding:20px}
.cele.open{display:grid;animation:cele-fade .3s ease-out}
.cele-card{position:relative;background:#fff;border-radius:22px;padding:22px 34px 26px;text-align:center;max-width:460px;width:100%;
  box-shadow:0 24px 60px rgba(0,0,0,.3),0 0 0 3px #bfe0ff;animation:cele-pop .5s cubic-bezier(.3,1.5,.5,1)}
.cele-card img{width:300px;max-width:80%;height:auto;display:block;margin:-90px auto 6px;filter:drop-shadow(0 8px 16px rgba(0,40,120,.3));animation:cele-bob 2.4s ease-in-out .5s infinite}
.cele-title{font-size:21px;font-weight:900;color:#0b2457}
.cele-sub{margin-top:6px;color:var(--ink-2);font-weight:700;font-size:14px}
.cele-card .btn{margin-top:16px;padding:9px 28px}
@keyframes cele-fade{from{opacity:0}to{opacity:1}}
@keyframes cele-pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes cele-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.overlay.open{display:block}

/* ── キャラクターモードの壁紙（ボタンの邪魔にならないよう、白く薄めて表示） ── */
html.chara-mode .content{background:linear-gradient(rgba(240,246,255,.8),rgba(240,246,255,.8)),url(img/wallpaper.webp) center/cover no-repeat}
html.chara-mode .topbar{background:rgba(255,255,255,.82)}

/* ── キャラクター ── */
.chara{position:absolute;left:0;top:0;z-index:25;pointer-events:none;transition:opacity .5s;display:flex;align-items:flex-end;justify-content:center}
.chara.hide{opacity:0}
.chara img{display:block;flex-shrink:0;pointer-events:auto;cursor:pointer;transform-origin:50% 100%;filter:drop-shadow(0 2px 2px rgba(10,30,70,.25))}
.chara.flip img{transform:scaleX(-1)}
.chara.m-sit img{transform-origin:50% 78%;animation:c-sway 3.2s ease-in-out infinite}
.chara.m-stand img{animation:c-breath 2.4s ease-in-out infinite}
.chara.m-walk img{animation:c-step .34s ease-in-out infinite}
.chara.flip.m-walk img{animation-name:c-step-f}
.chara.m-happy img{animation:c-hop .6s ease-out 3}
.chara.m-cheer img{animation:c-hop .5s ease-out infinite}

.chara.m-sleep img{animation:c-breath 3.6s ease-in-out infinite}
.chara.m-peek{overflow:hidden}
.chara.m-peek img{transition:transform .45s ease-in-out}
.chara.m-peek.down img{transform:translateY(100%)}
@keyframes c-sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes c-breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.97)}}
@keyframes c-step{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes c-step-f{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-2px)}}
 @keyframes c-wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-1px)}}
@keyframes c-wave-f{0%,100%{transform:scaleX(-1) rotate(-6deg)}50%{transform:scaleX(-1) rotate(6deg) translateY(-1px)}}
@keyframes c-hop{0%{transform:translateY(0)}40%{transform:translateY(-12px)}100%{transform:translateY(0)}}

/* ── 入口（ログイン画面） ──
   景色の画像を画面いっぱいに表示し、その上にログインのカードを重ねます。
   カードの大きさは LOGIN_CARD_SIZE（下の設定）で変えられます */
.lock{position:fixed;inset:0;z-index:9999;overflow:hidden;background:#8fc8f5 url(img/login-bg.webp) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;font-family:'Noto Sans JP',system-ui,sans-serif;transition:opacity .45s}
.lock.hidden{display:none}
.lock.leaving{opacity:0;pointer-events:none}
.lock-card{flex-shrink:0;width:980px;height:728px;margin-top:-40px;zoom:var(--lk,.6);border-radius:92px;
  background:linear-gradient(180deg,rgba(236,244,253,.9),rgba(246,250,255,.86));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 30px 70px rgba(20,70,140,.22),inset 0 2px 0 rgba(255,255,255,.95),0 0 0 2px rgba(255,255,255,.7);
  display:flex;flex-direction:column;align-items:center;padding:64px 110px 0;color:#0d2a63}
.lk-brand{display:flex;align-items:center;gap:44px;height:118px}
.lk-brand img{height:112px;width:auto}
.lk-brand span{font-weight:900;font-size:84px;letter-spacing:.01em;line-height:1;color:#0d2a63}
.lk-sub{display:flex;align-items:center;gap:34px;margin-top:22px;font-weight:800;font-size:36px;color:#1c3460}
.lk-sub i{display:block;width:126px;height:3px;border-radius:2px;background:#b8c8dc}
.lk-label{display:flex;align-items:center;gap:34px;margin-top:44px;font-weight:800;font-size:40px;color:#0d2a63;cursor:text}
.lk-label svg{width:50px;height:56px;flex-shrink:0}
.lk-field{display:flex;align-items:center;gap:26px;width:756px;height:98px;margin-top:34px;padding:0 34px;border-radius:28px;background:#fff;
  border:3px solid #cfdbea;box-shadow:inset 0 2px 6px rgba(20,60,120,.06);transition:border-color .15s,box-shadow .15s}
.lk-field:focus-within{border-color:#3d8ff0;box-shadow:0 0 0 6px rgba(61,143,240,.18)}
.lk-field svg{width:52px;height:52px;flex-shrink:0;color:#6f7f93}
.lk-field input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:40px;font-weight:700;color:#1c2a3d;font-family:inherit}
.lk-field input::placeholder{color:#a3adba}
.lk-btn{width:730px;height:114px;margin-top:48px;border-radius:60px;border:none;cursor:pointer;
  background:linear-gradient(90deg,#08b0f2 0%,#0a78e0 50%,#0a4cb6 100%);color:#fff;font-weight:900;font-size:48px;letter-spacing:.06em;font-family:inherit;
  box-shadow:0 12px 26px rgba(10,90,200,.35),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 10px rgba(0,30,100,.2);transition:transform .12s,filter .12s}
.lk-btn:hover{filter:brightness(1.06);transform:translateY(-2px)}
.lk-btn:active{transform:translateY(2px)}
.lock-error{margin-top:20px;height:40px;font-size:30px;font-weight:800;color:#e8455f;opacity:0;transition:opacity .2s}
.lock-error.show{opacity:1}
.lock-card.shake{animation:lk-shake .4s}
@keyframes lk-shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}


/* ── PC：1画面に収めて、画面の大きさに合わせて全体を拡大・縮小 ── */
html.fit,html.fit body{height:100%;overflow:hidden}
html.fit .app{position:absolute;left:0;top:0;min-height:0;width:var(--W);height:var(--H);zoom:var(--s)}
html.fit .sidebar{height:100%}
html.fit .content{height:100%;overflow:hidden}
/* 拡大・縮小中も、編集画面やポップアップがちょうど画面の大きさに収まるように */
html.fit .modal-bg,html.fit .cele,html.fit .prof,html.fit .overlay{inset:auto;left:0;top:0;width:var(--W);height:var(--H)}
html.fit .modal{max-height:calc(var(--H) * .86)}
html.fit .prof img{max-height:calc(var(--H) * .44)}
html.fit .quick{--qh:clamp(52px,calc((var(--H) - 58px - 30px - 28px - 300px) / 3),80px)}
html.fit .nav-link{height:24px;font-size:12px}
html.fit .nav-link.active{height:32px;margin-bottom:5px}

/* ── レスポンシブ ── */
@media (max-width:1180px){
  html:not(.fit) .quick{grid-template-columns:repeat(4,minmax(0,1fr))}
  html:not(.fit) .panels{grid-template-columns:repeat(2,minmax(0,1fr))}
  html:not(.fit) .status .st-date,html:not(.fit) .status .st-sep{display:none}
}
@media all{
  html:not(.fit),html:not(.fit) body{overflow:auto;height:auto}
  html:not(.fit) .app,html:not(.fit) .content{height:auto}
  html:not(.fit) .panels > .panel{min-height:300px}
  html:not(.fit) .tiles{height:auto;grid-template-rows:none;grid-auto-rows:44px}
  html:not(.fit) .notes{height:auto;grid-template-rows:none;grid-auto-rows:96px}
}
@media (max-width:860px){
  .prof img{max-width:92vw;max-height:60vh}
  html:not(.fit) .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  html:not(.fit) .sidebar.open{transform:none}
  html:not(.fit) .sidebar-close{display:grid;place-items:center;position:absolute;right:10px;top:calc(14px + env(safe-area-inset-top,0px));width:30px;height:30px;border-radius:8px;color:#fff;font-size:15px}
  html:not(.fit) .burger{display:grid;place-items:center}
  html:not(.fit) .topbar{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  html:not(.fit) .search-wrap{order:5;flex-basis:100%;max-width:none}
  html:not(.fit) .tb-label,html:not(.fit) .weather{display:none}
  html:not(.fit) .ticker{order:6;flex-basis:100%;max-width:none}
  html:not(.fit) main{padding:12px 12px 28px}
  html:not(.fit) .quick{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
  html:not(.fit) .qbtn{height:64px;flex-direction:column;justify-content:center;gap:4px;padding:6px;font-size:11.5px;text-align:center}
  html:not(.fit) .q-ico{width:32px;height:32px;border-radius:10px}
  html:not(.fit) .q-ico svg{width:19px;height:19px}
  html:not(.fit) .panels{grid-template-columns:minmax(0,1fr)}
  html:not(.fit) .panels > .panel{min-height:0}
  html:not(.fit) .p-body{max-height:none}
  html:not(.fit) .search input,html:not(.fit) .todo-form input,html:not(.fit) .field input,html:not(.fit) .field textarea{font-size:16px}
  html:not(.fit) .dd{position:fixed;left:12px;right:12px;width:auto;top:calc(110px + env(safe-area-inset-top,0px))}
}
</style>

<body>
<!-- 入口（ログイン画面） -->
<div class="lock" id="lock">
  <div class="lock-card" id="lock-card" role="form" aria-label="ログイン">
    <div class="lk-brand"><img id="lk-logo" src="img/dlp-logo.webp" alt=""><span>DLPポータル</span></div>
    <div class="lk-sub"><i></i>三島ポータル<i></i></div>
    <label class="lk-label" for="lock-input">
      <svg viewBox="0 0 24 28" aria-hidden="true"><path d="M6 12V8a6 6 0 0 1 12 0v4" fill="none" stroke="#0d2a63" stroke-width="3.2" stroke-linecap="round"/><rect x="2" y="12" width="20" height="15" rx="3.5" fill="#0d2a63"/><circle cx="12" cy="18.5" r="2.2" fill="#fff"/><rect x="11" y="19" width="2" height="4" rx="1" fill="#fff"/></svg>
      パスワードを入力してください</label>
    <div class="lk-field">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="15.5" cy="8.5" r="5.5" fill="currentColor"/><circle cx="16.5" cy="7.5" r="1.8" fill="#fff"/><path d="M11.5 12.5 3 21" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><path d="M5.5 18.5 7.5 20.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <input id="lock-input" type="password" placeholder="パスワード" autocomplete="current-password">
    </div>
    <button class="lk-btn" id="lock-btn" type="button">ログイン</button>
    <div class="lock-error" id="lock-error" role="alert">⚠ パスワードが違います</div>
  </div>
</div>
<script>
try{ if(sessionStorage.getItem('mishima_portal_auth')==='1') document.getElementById('lock').classList.add('hidden'); }catch(e){}
/* カードの大きさ：1 にすると元のデザイン画像と同じ大きさ。小さくしたいときは数字を下げてください */
var LOGIN_CARD_SIZE = 0.68;
(function(){
  var lock=document.getElementById('lock'), IW=1672, IH=941, CW=980, CH=728;
  function fitLock(){
    var w=innerWidth, h=innerHeight, k=Math.max(w/IW, h/IH);
    var z=Math.min(k*0.8327*LOGIN_CARD_SIZE, w*.9/CW, h*.82/CH);
    lock.style.setProperty('--lk', z);
    lock.style.backgroundPosition = (w/h < .8) ? '22% center' : 'center';
  }
  fitLock(); addEventListener('resize', fitLock);
})();
</script>

<!-- キャラクターの紹介（キャラクターをクリックすると、順番に表示） -->

<!-- モーダル：ショートカット追加・編集 -->
<div class="modal-bg" id="sc-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sc-modal-title">
    <div class="modal-head"><h2 id="sc-modal-title">ショートカットを追加</h2><button class="modal-x" data-close="sc-modal" aria-label="閉じる">✕</button></div>
    <div class="modal-body">
      <div class="field"><label for="sc-name">名前</label><input id="sc-name" placeholder="例：会社ドライブ" maxlength="20"></div>
      <div class="field"><label for="sc-url">URL</label><input id="sc-url" placeholder="https://..."></div>
      <div class="field"><label for="sc-icon">アイコン（絵文字1文字・空欄でもOK）</label><input id="sc-icon" placeholder="📌" maxlength="2"></div>
      <div class="field-err" id="sc-err"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-plain" data-close="sc-modal">キャンセル</button>
      <button class="btn btn-primary" id="sc-save">保存する</button>
    </div>
  </div>
</div>

<!-- モーダル：付箋メモ -->

    <div class="modal-head"><h2 id="note-modal-title">付箋メモを貼る</h2><button class="modal-x" data-close="note-modal" aria-label="閉じる">✕</button></div>
    <div class="modal-body">
      <div class="field"><label for="note-title">見出し（空欄でもOK）</label><input id="note-title" placeholder="例：田中様へ電話" maxlength="24"></div>

  get(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },

const scaleNow = () => { const a = document.querySelector('.app'); return (a && a.offsetWidth) ? (a.getBoundingClientRect().width / a.offsetWidth) || 1 : 1; };
// 画面の拡大・縮小を戻した座標（.app の中での位置）
function stageRect(node){
  const r = node.getBoundingClientRect(), a = document.querySelector('.app').getBoundingClientRect(), s = scaleNow();
  const left = (r.left - a.left) / s, top = (r.top - a.top) / s;

}

  clearTimeout(hideTimer);

  const f = $('flyout'); f.dataset.cat = c.id;
  f.innerHTML = `<div class="flyout-title">${c.icon} ${esc(c.name)}</div>` +

      ? `<a ${linkAttrs(l.name, l.url)}>${esc(l.name)}</a>`
      : `<span class="fly-off" title="リンク準備中">${esc(l.name)}<small>整備中</small></span>`).join('') : '<div class="flyout-title">リンクはまだありません</div>');
  f.classList.add('open');
  const app = document.querySelector('.app'), r = stageRect(btn), W = app.offsetWidth, H = app.offsetHeight;
  const left = Math.min(r.right + 16, W - f.offsetWidth - 8);
  const top = Math.max(8, Math.min(r.top, H - f.offsetHeight - 8));
  f.style.left = left + 'px'; f.style.top = top + 'px';
}

// ※ 自分のタスクは旧ポータルのTodoと同じ保存場所なので、登録済みのTodoはそのまま引き継がれます
const TODO_KEY = 'mishima_portal_todos';
let todos = store.get(TODO_KEY, []);
if(!Array.isArray(todos)) todos = [];
function routineKey(){ return 'mishima_routine_' + ymd(new Date()); }
let wasAllDone = null;
function renderTasks(){
  const key = routineKey();
  store.keys().filter(k => k.startsWith('mishima_routine_') && k !== key).forEach(k => store.del(k));
  const done = new Set(store.get(key, []));
  const sorted = todos.map((t,i) => ({...t,i})).sort((a,b) => (a.time||'99') < (b.time||'99') ? -1 : (a.time||'99') > (b.time||'99') ? 1 : a.i - b.i);
  $('task-list').innerHTML =
    ROUTINES.map(r => `<label class="check-row"><input type="checkbox" data-rt="${esc(r.id)}" ${done.has(r.id)?'checked':''}>
      <span class="box">${checkSvg}</span><span class="check-text">${esc(r.title)}</span><span class="check-time">${esc(r.time||'')}</span></label>`).join('') +
    sorted.map(t => `<label class="check-row"><input type="checkbox" data-td="${t.i}" ${t.done?'checked':''}>
      <span class="box">${checkSvg}</span><span class="check-text" title="${esc(t.text)}">${esc(t.text||'')}</span><span class="check-time">${esc(t.time||'')}</span>
      <button class="todo-del" type="button" data-del="${t.i}" aria-label="${esc(t.text)}を削除">✕</button></label>`).join('');
  $('task-list').querySelectorAll('[data-rt]').forEach(inp => inp.onchange = () => {
    const s = new Set(store.get(routineKey(), []));
    inp.checked ? s.add(inp.dataset.rt) : s.delete(inp.dataset.rt);
    store.set(routineKey(), [...s]); updateTaskProgress(true);
  });
  $('task-list').querySelectorAll('[data-td]').forEach(inp => inp.onchange = () => { todos[+inp.dataset.td].done = inp.checked; store.set(TODO_KEY, todos); updateTaskProgress(true); });
  $('task-list').querySelectorAll('[data-del]').forEach(b => b.onclick = e => { e.preventDefault(); todos.splice(+b.dataset.del,1); store.set(TODO_KEY, todos); renderTasks(); });
  updateTaskProgress(false);
}
function updateTaskProgress(byUser){
  const ids = new Set(ROUTINES.map(r => r.id));
  const n = store.get(routineKey(), []).filter(id => ids.has(id)).length + todos.filter(t => t.done).length;
  const t = ROUTINES.length + todos.length;
  const all = t > 0 && n === t;
  $('task-count').textContent = all ? '🎉 完了！' : `${n}/${t}件`;
  $('task-count').classList.toggle('done', all);
  $('task-bar').style.width = (t ? n/t*100 : 0) + '%';
  if(byUser && all && wasAllDone === false){ Chara.celebrate(); showCelebration(); }
  wasAllDone = all;
}

let srFocus = -1, srList = [];
function runSearch(q){
  const box = $('search-results'); q = q.trim().toLowerCase();

    .filter(x => { const k = (x.url || x.kind) + x.name; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0, 14);

        : `<a class="sr-item" data-i="${i}" ${linkAttrs(x.name, x.url)}><span class="sr-kind">${esc(x.kind)}</span><span><div class="sr-name">${esc(x.name)}</div><div class="sr-sub">${esc(x.sub)}</div></span></a>`).join('')
    : `<div class="sr-empty">「${esc(q)}」に一致するものは見つかりませんでした。別の言葉で試すか、左のメニューから探してください。</div>`;
  box.querySelectorAll('[data-i]').forEach(a => a.addEventListener('click', () => {

const Chara = (() => {
  const KEY = 'mishima_portal_chara_mode';
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const SPEED = 42;                 // 歩く速さ（1秒あたりのpx）
  let on = store.get(KEY, false) === true;   // 最初はオフ（右上の人型アイコンから「キャラクターモード」をオンにできます）
  const app = document.querySelector('.app');
  const el = document.createElement('div'); el.className = 'chara hide'; el.setAttribute('aria-hidden', 'true');
  const img = document.createElement('img'); img.alt = ''; img.draggable = false; el.appendChild(img);
  app.appendChild(el);
  // キャラクターをクリックすると、紹介画像を順番に表示
  img.title = 'ディルチャ（クリックで紹介を見る）';
  img.addEventListener('click', e => { e.stopPropagation(); showProfile(); });
  let loaded = false;   // キャラクター画像は、キャラクターモードにしたときだけ読み込む
  const preload = () => { if(loaded) return; loaded = true; Object.values(CHARA_SPRITES).forEach(s => { const i = new Image(); i.src = s.src; }); };
  if(on) preload();

  let x = 0, y = 0, pose = 'stand', where = null;   // where：'panel'（下の欄のふち）/ 'btn'（ボタンのふち）
  let timer = null, raf = null, frameT = null, token = 0, moving = false, sleeping = false, visible = false;
  let lastActive = Date.now(), lastIdle = '', lastW = innerWidth;

  const isFit = () => document.documentElement.classList.contains('fit');
  const allowed = () => CHARA.CHARA_ENABLED && on && innerWidth >= 340 && $('lock').classList.contains('hidden');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const MODES = ['m-sit','m-stand','m-walk','m-happy','m-sleep','m-peek','m-wave','m-cheer','down'];
  function setMode(m){ el.classList.remove(...MODES); if(m) el.classList.add('m-' + m); }
  function setPose(p){ pose = p; const s = CHARA_SPRITES[p]; img.src = s.src; img.style.width = s.w + 'px'; img.style.height = s.h + 'px'; }
  // x：キャラの中心、y：乗っている「ふち」の高さ
  function draw(){
    const s = CHARA_SPRITES[pose];
    const top = (s.edge != null ? y - s.h * s.edge : y - s.h + 1) - (s.lift || 0);
    el.style.width = s.w + 'px'; el.style.height = s.h + 'px';
    el.style.left = Math.round(x - s.w / 2) + 'px'; el.style.top = Math.round(top) + 'px';
  }
  function show(v){ visible = v; el.classList.toggle('hide', !v); }
  function stopAnim(){ cancelAnimationFrame(raf); clearInterval(frameT); raf = null; frameT = null; moving = false; }
  function stopAll(){ clearTimeout(timer); stopAnim(); token++; }

  // 歩く場所：PCは下の4つの欄の上のふち、スマホは「毎日のタスク」の欄の上のふち
  function panelRow(){
    let ps = [...document.querySelectorAll('.panels > .panel')].map(stageRect);
    if(!ps.length) return null;
    if(!isFit()) ps = ps.slice(0, 1);
    // 欄ごとの「乗れる範囲」（欄と欄のすき間には乗りません）
    const segs = ps.map(p => ({ l:p.left + 18, r:p.right - 18 }));
    return { y:ps[0].top, left:segs[0].l, right:segs[segs.length - 1].r, segs };
  }
  // 歩く場所のすぐ上の段にある、整備中ではないボタン（ここに飛び乗ります）
  function upperButtons(){
    const bs = [...document.querySelectorAll('#quick .qbtn:not(.qbtn-empty)')].map(stageRect);
    if(!bs.length) return [];
    const top = Math.max(...bs.map(b => b.top));
    return bs.filter(b => Math.abs(b.top - top) < 4);
  }

  // 歩いて移動
  // 欄の上だけを歩き、欄と欄のすき間はジャンプで越える
  function segAt(row, px){ return row.segs.findIndex(s => px >= s.l - 1 && px <= s.r + 1); }
  function snap(row, px){ // いちばん近い「乗れる場所」に合わせる
    let best = px, d = 1e9;
    row.segs.forEach(s => { const c = clamp(px, s.l, s.r); if(Math.abs(c - px) < d){ d = Math.abs(c - px); best = c; } });
    return best;
  }
  function travel(tx, done){
    const row = panelRow(); if(!row){ done && done(); return; }
    tx = snap(row, tx);
    const go = () => {
      const a = segAt(row, x), b = segAt(row, tx);
      if(a < 0 || b < 0 || a === b) return walkTo(tx, done);
      const dir = b > a ? 1 : -1, cur = row.segs[a], nxt = row.segs[a + dir];
      const edge = dir > 0 ? cur.r : cur.l, land = dir > 0 ? nxt.l : nxt.r;
      walkTo(edge, () => flipTo(land, row.y, () => { x = land; go(); }));   // すき間はバク転で飛び越える
    };
    go();
  }
  // バク転で移動（進む方向に背中を向けて、後ろ宙返りで飛び越える）
  function flipTo(tx, ty, done){
    stopAnim(); moving = true;
    const d = tx > x ? 'l' : 'r';   // 右へ進むときは左を向いて、後ろ（右）へ宙返り
    el.classList.remove('flip'); setMode(null); setPose('flip_' + d + '1'); draw();
    const x0 = x, y0 = y, dur = 820;
    let t0 = performance.now() + 200;
    const peak = Math.min(y0, ty) - 30, c = 2 * peak - (y0 + ty) / 2;
    const step = now => {
      if(now < t0){ raf = requestAnimationFrame(step); return; }
      const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const fr = t < .25 ? 2 : t < .55 ? 3 : t < .9 ? 4 : 5; if(pose !== 'flip_' + d + fr) setPose('flip_' + d + fr);
      x = x0 + (tx - x0) * e;
      y = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * c + t * t * ty;
      draw();
      if(t < 1) raf = requestAnimationFrame(step);
      else { x = tx; y = ty; setPose('flip_' + d + '5'); draw(); raf = null;
        setTimeout(() => { setPose('flip_' + d + '6'); draw(); setTimeout(() => { stopAnim(); done && done(); }, 500); }, 200); }
    };
    raf = requestAnimationFrame(step);
  }
  // ときどき（約3回に1回）、歩きながら手を振る
  function walkTo(tx, done){
    stopAnim(); moving = true;
    const dir = tx < x ? -1 : 1;
    // 普通に歩くときは、右向き・左向きそれぞれの絵（左右の腕と足を交互に振る4コマ）を使います
    const waving = Math.random() < .3;
    const frames = waving ? ['walk_wave1','walk_wave2','walk_wave3','walk_wave4']
      : (dir > 0 ? ['wr1','wr2','wr3','wr4'] : ['wl1','wl2','wl3','wl4']);
    el.classList.toggle('flip', waving && dir < 0); setMode('walk');
    let f = 0; setPose(frames[0]); draw();
    frameT = setInterval(() => { f = (f + 1) % frames.length; setPose(frames[f]); draw(); }, waving ? 200 : 190);
    let last = performance.now();
    const step = now => {
      x += dir * SPEED * Math.min(50, now - last) / 1000; last = now;
      if((dir > 0 && x >= tx) || (dir < 0 && x <= tx)){ x = tx; stopAnim(); draw(); done && done(); return; }
      draw(); raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  // ジャンプして移動（放物線を描いて、なめらかに）
  function jumpTo(tx, ty, done){
    stopAnim(); moving = true;
    const d = tx < x ? 'l' : 'r';
    el.classList.remove('flip'); setMode(null); setPose('jump_' + d + '1'); draw();
    const x0 = x, y0 = y, dur = 700;
    let t0 = performance.now() + 160;   // 踏み切りのしゃがみ
    const peak = Math.min(y0, ty) - 26, c = 2 * peak - (y0 + ty) / 2;
    const step = now => {
      if(now < t0){ raf = requestAnimationFrame(step); return; }
      const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const fr = t < .45 ? 2 : t < .9 ? 3 : 4; if(pose !== 'jump_' + d + fr) setPose('jump_' + d + fr);
      x = x0 + (tx - x0) * e;
      y = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * c + t * t * ty;
      draw();
      if(t < 1) raf = requestAnimationFrame(step);
      else { x = tx; y = ty; setPose('jump_' + d + '4'); draw(); raf = null; setTimeout(() => { stopAnim(); done && done(); }, 180); }
    };
    raf = requestAnimationFrame(step);
  }
  const later = (my, ms, fn) => setTimeout(() => { if(my === token) fn(); }, ms);
  // 手を振る（左右どちらの手か、振り方もランダム）
  function wave(my, ms, then){
    el.classList.toggle('flip', Math.random() < .5);
    setPose('wave'); draw(); setMode('wave');
    later(my, ms, () => { el.classList.remove('flip'); setMode('stand'); setPose('stand'); draw(); then && then(); });
  }
  // その場での動き
  function idle(kind){
    const my = ++token;
    el.classList.remove('flip');
    lastIdle = kind;
    switch(kind){
      case 'sit':   // ふちに腰かける → ときどきうとうと
        setMode('sit'); setPose('sit_edge'); draw();
        if(where === 'panel' && Math.random() < .35) later(my, 9000, () => { setMode('sleep'); setPose('sleep'); draw(); later(my, 6000, () => { setMode('sit'); setPose('sit_edge'); draw(); }); });
        break;
      case 'lie':   // ふちに寝そべる
        setMode('sit'); setPose('lie_edge'); draw(); break;
      case 'floor': // ちょこんと座る
        setMode('stand'); setPose('sit'); draw(); break;
      case 'stand': // 立って、手を振る
        setMode('stand'); setPose('stand'); draw();
        if(Math.random() < .4) later(my, 1800, () => wave(my, 2200));
        break;
      case 'cheer': // 両手を上げてぴょんぴょん
        setMode('cheer'); setPose('happy'); draw();
        later(my, 2400, () => { setMode('stand'); setPose('stand'); draw(); });
        break;
      case 'nap':   // ひと休み
        setMode('sleep'); setPose('sleep'); draw();
        later(my, 9000, () => { setMode('cheer'); setPose('happy'); draw(); later(my, 1300, () => { setMode('stand'); setPose('stand'); draw(); }); });
        break;
      case 'flip': { // その場でバク転
        const d = Math.random() < .5 ? 'r' : 'l'; setMode(null);
        let f = 1; setPose('flip_' + d + 1); draw();
        const iv = setInterval(() => { if(my !== token){ clearInterval(iv); return; } f++;
          if(f > 6){ clearInterval(iv); later(my, 1400, () => { setMode('stand'); setPose('stand'); draw(); }); return; }
          setPose('flip_' + d + f); draw(); }, 150);
        break; }
      case 'peek':  // 欄のふちの向こうに、いったん隠れてから顔を出す
        setPose('stand'); draw(); setMode('peek');
        requestAnimationFrame(() => el.classList.add('down'));
        later(my, 480, () => { setPose('peek'); draw(); requestAnimationFrame(() => el.classList.remove('down')); });
        later(my, 6000, () => el.classList.add('down'));
        later(my, 6500, () => { setPose('stand'); draw(); el.classList.remove('down'); later(my, 480, () => setMode('stand')); });
        break;
    }
  }
  function pickIdle(){
    const list = ['sit','sit','lie','floor','stand','stand','cheer','nap','peek','flip'].filter(k => k !== lastIdle);
    return pick(list);
  }
  const nextIn = (a, b) => { clearTimeout(timer); timer = setTimeout(step, rand(a, b) * 1000); };

  function step(){
    if(!allowed()){ stopAll(); show(false); where = null; timer = setTimeout(step, 3000); return; }
    const row = panelRow(); if(!row){ timer = setTimeout(step, 3000); return; }
    if(!where){
      // 最初の登場：欄のふちの上に、ふわっと現れる
      where = 'panel'; x = snap(row, rand(row.left, row.right)); y = row.y; idle('stand'); show(true);
      return nextIn(6, 9);
    }
    if(sleeping || moving) return nextIn(3, 5);
    if(Date.now() - lastActive > CHARA.SLEEP_MIN * 60000) return goSleep();
    token++;
    if(where === 'btn'){
      // ボタンの上から、下の欄のふちへ飛び降りる
      return jumpTo(snap(row, x), row.y, () => { where = 'panel'; idle(pick(['stand','cheer','floor'])); nextIn(5, 9); });
    }
    y = row.y;
    const bs = upperButtons();
    if(bs.length && Math.random() < .25){
      // 近くのボタンの下まで歩いて、ボタンの上に飛び乗る
      const near = bs.slice().sort((a, b) => Math.abs((a.left + a.right) / 2 - x) - Math.abs((b.left + b.right) / 2 - x)).slice(0, 2);
      const b = pick(near), tx = snap(row, clamp(rand(b.left + b.width * .55, b.right - 20), row.left, row.right));
      return travel(tx, () => { setMode('stand'); setPose('stand'); draw();
        setTimeout(() => jumpTo(clamp(tx, b.left + 14, b.right - 14), b.top, () => { where = 'btn'; idle(pick(['sit','sit','stand','lie'])); nextIn(CHARA.MOVE_SEC[0], CHARA.MOVE_SEC[1]); }), 600); });
    }
    // 欄のふちを歩いて、少し離れた場所へ（ときどき、その場で別の動き）
    if(Math.random() < .25){ idle(pickIdle()); return nextIn(CHARA.MOVE_SEC[0], CHARA.MOVE_SEC[1]); }
    const span = row.right - row.left;
    const dist = rand(Math.min(60, span / 3), Math.min(300, span * .8)) * (Math.random() < .5 ? -1 : 1);
    let tx = x + dist; if(tx < row.left || tx > row.right) tx = x - dist;
    tx = clamp(tx, row.left, row.right);
    travel(tx, () => { idle(pickIdle()); nextIn(CHARA.MOVE_SEC[0], CHARA.MOVE_SEC[1]); });
  }
  function goSleep(){
    stopAll(); sleeping = true;
    el.classList.remove('flip'); setMode('sleep'); setPose('sleep'); draw();
  }
  function wake(){ sleeping = false; idle('cheer'); nextIn(4, 7); }
  ['mousemove','keydown','pointerdown','wheel','touchstart'].forEach(ev => addEventListener(ev, () => {
    const now = Date.now(); if(now - lastActive < 800 && !sleeping) return;
    lastActive = now; if(sleeping) wake();
  }, { passive:true }));
  // 画面の幅が変わったら、今いる場所に合わせ直す（スマホのアドレスバーの出し入れでは動かさない）
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => {
    if(Math.abs(innerWidth - lastW) < 2 && where) return;
    lastW = innerWidth;
    if(!allowed()){ stopAll(); show(false); where = null; timer = setTimeout(step, 1000); return; }
    const row = panelRow(); if(!row || !where) return;
    stopAll(); where = 'panel'; x = snap(row, x); y = row.y; idle('stand'); show(true); nextIn(4, 7);
  }, 250); });

  return {
    start(){ timer = setTimeout(step, 1500); },
    refresh(){ stopAll(); show(false); where = null; timer = setTimeout(step, 1200); },
    isOn: () => on,
    setOn(v){ on = v; store.set(KEY, v); if(v) preload(); stopAll(); show(false); where = null; if(v) timer = setTimeout(step, 300); },
    celebrate(){
      if(!visible || moving || sleeping || reduce) return;
      stopAll(); idle(where === 'panel' ? 'flip' : 'cheer'); nextIn(6, 10);
    },
  };
})();


/* ───────── 入室パスワード ───────── */
const SESSION_KEY = 'mishima_portal_auth';
function sessionGet(){ try{ return sessionStorage.getItem(SESSION_KEY); }catch(e){ return null; } }
function unlock(){
  const l = $('lock'); l.classList.add('leaving');
  setTimeout(() => { l.classList.add('hidden'); l.classList.remove('leaving'); Chara.refresh(); }, 450);
  if(REMEMBER_LOGIN){ try{ sessionStorage.setItem(SESSION_KEY,'1'); }catch(e){} }
}
function tryUnlock(){
  // 全角で入力された場合や前後の空白も許容する
  const v = ($('lock-input').value || '').normalize('NFKC').trim();
  if(v === PASS){ unlock(); return; }
  $('lock-error').classList.add('show'); $('lock-input').value = ''; $('lock-input').focus();
  const c = $('lock-card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
  setTimeout(() => $('lock-error').classList.remove('show'), 2200);
}
function lockNow(){
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
  $('lock-input').value = ''; $('lock').classList.remove('hidden','leaving'); closeMenu(); Chara.refresh();
  setTimeout(() => $('lock-input').focus(), 50);
}
if(REMEMBER_LOGIN && sessionGet() === '1') $('lock').classList.add('hidden');
else { try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} $('lock').classList.remove('hidden'); setTimeout(() => $('lock-input').focus(), 50); }
$('lock-now').onclick = lockNow;
$('lock-btn').addEventListener('click', tryUnlock);
$('lock-input').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing) tryUnlock(); });

/* ホーム画面に追加したときの動作（旧ポータルから継続） */
if('serviceWorker' in navigator){
  addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

/* ───────── 起動 ───────── */
renderNav(); renderQuick(); renderTicker(); renderTasks(); renderTools(); renderShortcuts(); renderNotes();
tick(); setInterval(tick, 15000);
fetchWeather(); setInterval(fetchWeather, 30*60*1000);
Chara.start();
// キャラクターモード：アイコンをキャラクターの顔に、背景を壁紙（img/wallpaper.webp）に、キャラクターを登場させる
function applyCharaMode(){
  const on = Chara.isOn(), m = document.querySelector('.logo-mark');
  document.documentElement.classList.toggle('chara-mode', on);
  m.classList.toggle('face', on);
  m.style.backgroundImage = on ? `url(${LOGO_FACE})` : '';
}
applyCharaMode();
