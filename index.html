<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2477e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="三島ポータル">
<link rel="apple-touch-icon" href="./icon.svg">
<title>三島ポータル</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=Noto+Sans+JP:wght@400;500;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf3fb;
  --surface:#ffffff;
  --surface-2:#f6f9fe;
  --ink:#1c2a3d;
  --ink-2:#4a5b73;
  --ink-3:#8494aa;
  --line:#dde6f2;
  --blue:#2477e0;
  --blue-deep:#1760c0;
  --blue-soft:#e5effd;
  --red:#e8455f;
  --red-soft:#fde8ec;
  --green:#16a36b;
  --green-soft:#e3f6ee;
  --orange:#ef8414;
  --orange-soft:#fff0df;
  --purple:#7457e0;
  --purple-soft:#efebfd;
  --yellow:#ffd84a;
  --radius-l:18px;
  --radius-m:12px;
  --radius-s:8px;
  --shadow:0 1px 2px rgba(28,42,61,.05),0 6px 18px rgba(36,119,224,.07);
  --sidebar-w:216px;
  --num:'Outfit','Noto Sans JP',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',Meiryo,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ── レイアウト ── */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40;
  padding-top:env(safe-area-inset-top,0px);
}
.content{flex:1;min-width:0;display:flex;flex-direction:column}

/* ── サイドバー ── */
.logo{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex-shrink:0}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:20px;flex-shrink:0}
.logo-text{font-weight:900;font-size:15.5px;line-height:1.15;letter-spacing:.02em}
.logo-text span{display:block;color:var(--blue)}
.nav{flex:1;min-height:0;overflow-y:auto;padding:2px 10px 8px;scrollbar-width:thin}
.nav-item{position:relative}
.nav-link{display:flex;align-items:center;gap:11px;width:100%;padding:6px 12px;border-radius:9px;
  font-weight:700;font-size:13px;color:var(--ink);text-align:left;transition:background .15s}
.nav-link:hover{background:var(--surface-2)}
.nav-link.active{background:#fff6cc;box-shadow:inset 0 0 0 1.5px #f2cf3c}
.nav-ico{width:20px;text-align:center;font-size:15px}
.flyout{position:fixed;min-width:240px;max-width:300px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-m);box-shadow:0 12px 32px rgba(28,42,61,.16);padding:8px;display:none;z-index:60}
.flyout.open{display:block}
.flyout-title{font-size:12px;font-weight:700;color:var(--ink-3);padding:6px 10px 8px}
.flyout a{display:block;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500}
.flyout a:hover{background:var(--blue-soft);color:var(--blue-deep)}
.fly-off{display:block;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--ink-3);cursor:default}
.sr-off{opacity:.55;cursor:default}
.sr-off:hover{background:none}
.help{margin:6px 10px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface-2);flex-shrink:0}
.help-q{display:flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px}
.help-q i{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-style:normal;
  display:grid;place-items:center;font-size:13px;font-weight:900}
.help-who{margin-top:4px;font-size:12.5px;color:var(--ink-2)}
.help-who b{color:var(--blue)}
.help-chat{display:block;margin-top:7px;text-align:center;padding:5px;border-radius:8px;background:var(--surface);
  border:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--blue)}
.help-chat:hover{border-color:var(--blue)}
.lock-now{margin:-4px 10px 12px;padding:5px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--ink-3);flex-shrink:0}
.lock-now:hover{color:var(--blue);background:var(--surface-2)}
.sidebar-close{display:none}

/* ── トップバー ── */
.topbar{background:var(--blue);padding:9px 18px;display:flex;align-items:center;gap:18px;flex-shrink:0;
  position:sticky;top:0;z-index:30;padding-top:calc(9px + env(safe-area-inset-top,0px))}
.burger{display:none;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font-size:20px}
.search-wrap{flex:1;max-width:560px;position:relative}
.search{display:flex;align-items:center;background:#fff;border-radius:12px;padding:5px 5px 5px 14px;gap:10px}
.search svg{flex-shrink:0;color:var(--blue)}
.search input{flex:1;border:none;outline:none;background:none;font-size:13.5px;min-width:0;padding:4px 0}
.search input::placeholder{color:var(--ink-3)}
.search-btn{background:var(--yellow);color:var(--ink);font-weight:700;padding:6px 16px;border-radius:9px;font-size:13px}
.search-btn:hover{background:#ffcf1f}
.search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border-radius:var(--radius-m);
  box-shadow:0 14px 36px rgba(28,42,61,.2);max-height:380px;overflow-y:auto;display:none;padding:6px}
.search-results.open{display:block}
.sr-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px}
.sr-item:hover,.sr-item.focus{background:var(--blue-soft)}
.sr-kind{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:2px 7px;border-radius:5px;flex-shrink:0}
.sr-item:hover .sr-kind{background:#fff}
.sr-name{font-weight:700;font-size:13.5px}
.sr-sub{font-size:11.5px;color:var(--ink-3)}
.sr-empty{padding:16px;color:var(--ink-2);font-size:13px}
.freq{color:#fff;min-width:0}
.freq-label{font-size:11px;opacity:.85;margin-bottom:3px}
.freq-chips{display:flex;gap:6px;flex-wrap:wrap}
.freq-chips button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);
  padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:500}
.freq-chips button:hover{background:#fff;color:var(--blue)}
.status{margin-left:auto;display:flex;align-items:center;gap:16px;background:#fff;border-radius:12px;padding:6px 14px;flex-shrink:0}
.weather{display:flex;align-items:center;gap:6px;font-family:var(--num);font-weight:700;font-size:17px;color:var(--blue)}
.weather span:first-child{font-size:22px}
.st-mid{border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 14px;line-height:1.2}
.st-date{font-family:var(--num);font-weight:700;font-size:19px;letter-spacing:.01em;white-space:nowrap}
.st-date small{font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;margin-left:2px}
.clock{font-family:var(--num);font-weight:700;font-size:20px;letter-spacing:.02em}

/* ── メイン ── */
main{padding:14px 18px 28px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow)}
.row-top{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.row-tools{display:grid;grid-template-columns:minmax(0,1.15fr) repeat(2,minmax(0,1fr)) minmax(0,1.1fr);gap:14px}
.p-head{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;flex-shrink:0}
.p-title{font-weight:900;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.p-title .ico{font-size:16px}
.p-link{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue);white-space:nowrap}
.p-link:hover{text-decoration:underline}
.p-body{padding:0 18px 16px}

/* ── バナー ── */
.banner{position:relative;border-radius:var(--radius-l);overflow:hidden;min-height:240px;color:#fff;
  background:linear-gradient(125deg,#0f3f8c 0%,#1f6fe0 55%,#57a6ff 100%);box-shadow:var(--shadow)}
.banner-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:100% 40%}
.banner-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,44,104,.9) 0%,rgba(14,56,128,.74) 40%,rgba(20,70,150,.18) 60%,rgba(20,70,150,0) 72%)}
.banner-deco{position:absolute;right:-40px;top:-40px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%);pointer-events:none}
.banner-inner{position:relative;height:100%;min-height:240px;padding:14px 60px 34px 58px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;max-width:60%}
.banner-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.banner-tag{background:#fff;color:var(--red);font-weight:700;font-size:11.5px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.banner-title{font-weight:900;font-size:clamp(16px,1.35vw,21px);line-height:1.4;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.banner-desc{display:none!important;font-size:12.5px;opacity:.92;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.banner-meta{font-family:var(--num);font-size:11.5px;white-space:nowrap;opacity:.85;font-weight:600}
.banner-btn{align-self:flex-start;background:#fff;color:var(--blue-deep);font-weight:700;font-size:13px;padding:8px 18px;border-radius:10px}
.banner-btn:hover{background:var(--yellow);color:var(--ink)}
.banner-nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.22);color:#fff;font-size:18px;display:grid;place-items:center;backdrop-filter:blur(4px)}
.banner-nav:hover{background:rgba(255,255,255,.4)}
.banner-nav.prev{left:12px}.banner-nav.next{right:12px}
.banner-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:7px}
.banner-dots button{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45)}
.banner-dots button.on{background:#fff;width:22px;border-radius:5px}
.banner-src{position:absolute;right:12px;bottom:9px;font-size:10px;background:rgba(12,44,104,.55);padding:2px 8px;border-radius:999px}

/* ── お知らせ ── */
.announce .p-head{background:linear-gradient(90deg,#ff8095,#ff9eae);border-radius:var(--radius-l) var(--radius-l) 0 0;color:#fff;padding:10px 16px}
.announce .p-link{color:#fff}
.ann-list{padding:4px 12px 8px}
.ann-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ann-item:last-child{border-bottom:none}
.ann-item:hover .ann-title{color:var(--blue)}
.tag{flex-shrink:0;font-size:11px;font-weight:700;padding:3px 6px;border-radius:6px;min-width:62px;text-align:center}
.tag-notice{background:var(--red-soft);color:var(--red)}
.tag-update{background:var(--green-soft);color:var(--green)}
.tag-system{background:var(--blue-soft);color:var(--blue)}
.ann-date{font-family:var(--num);font-size:11px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.ann-title{font-weight:700;font-size:13px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ann-item.open .ann-title{white-space:normal}
.ann-desc{grid-column:2/4;font-size:12px;color:var(--ink-2);margin-top:3px;display:none}
.ann-item.open .ann-desc{display:block}

/* ── ルーティン ── */
.routine .p-head{background:linear-gradient(90deg,#2d86ec,#5aa5f5);color:#fff;border-radius:var(--radius-l) var(--radius-l) 0 0;padding:10px 16px}
.routine-date{margin-left:auto;font-size:12px;font-weight:500;opacity:.95}
.rt-progress{padding:10px 16px 4px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.rt-count{font-family:var(--num);font-weight:800;font-size:22px;line-height:1;white-space:nowrap}
.rt-count small{font-size:13px;color:var(--ink-3);font-weight:600}
.rt-bar{flex:1;height:10px;background:var(--blue-soft);border-radius:6px;overflow:hidden}
.rt-bar div{height:100%;background:var(--blue);border-radius:6px;transition:width .35s ease}
.rt-msg{font-size:11.5px;color:var(--ink-2);white-space:nowrap;gap:6px;overflow:hidden}
.rt-msg.done{color:var(--green);font-weight:700}
.rt-list{padding:2px 10px 10px;display:flex;flex-direction:column;gap:1px}
.check-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;cursor:pointer;user-select:none}
.check-row:hover{background:var(--surface-2)}
.check-row input{position:absolute;opacity:0;pointer-events:none}
.box{width:20px;height:20px;border-radius:6px;border:2px solid #b7c5d8;flex-shrink:0;display:grid;place-items:center;transition:all .15s;background:#fff}
.box svg{opacity:0;transform:scale(.6);transition:all .15s}
.check-row input:checked + .box{background:var(--blue);border-color:var(--blue)}
.check-row input:checked + .box svg{opacity:1;transform:scale(1)}
.check-row input:focus-visible + .box{outline:2.5px solid var(--blue);outline-offset:2px}
.check-text{flex:1;font-size:13px;font-weight:500;min-width:0}
.check-row input:checked ~ .check-text{color:var(--ink-3);text-decoration:line-through}
.check-time{font-family:var(--num);font-size:12px;color:var(--ink-3);font-weight:600}

/* ── 目標・指標 ── */
.goals{border:2px solid #ff8aa0}
.goals .p-head{padding:8px 18px 5px}
.goals .p-title{background:linear-gradient(transparent 62%,#ffe98a 62%)}
.goal-month{margin-left:auto;font-size:12.5px;color:var(--ink-2)}
.dummy-badge{font-size:11px;font-weight:700;background:var(--orange-soft);color:var(--orange);padding:3px 9px;border-radius:6px}
.goal-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:2px 14px 10px}
.goal{border:1px solid var(--line);border-radius:var(--radius-m);padding:8px 11px;display:flex;flex-direction:column;gap:5px;background:var(--surface);min-width:0}
.goal-top{display:flex;gap:10px;align-items:center}
.goal-ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex-shrink:0;color:#fff}
.goal-name{font-weight:900;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-sub{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.goal-top > div:nth-child(2){min-width:0;flex:1}
.goal-stat{display:flex;justify-content:flex-start;gap:6px;align-items:baseline;font-size:11.5px;color:var(--ink-2);white-space:nowrap;gap:6px;overflow:hidden}
.goal-stat b{font-family:var(--num);font-size:14px;color:var(--ink)}
.goal-period{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;margin-right:4px;line-height:1.5}
.goal-big{margin-left:auto;flex-shrink:0;font-family:var(--num);font-size:20px;font-weight:800;line-height:1;white-space:nowrap}
.goal-big small{font-family:'Noto Sans JP',sans-serif;font-size:10px;font-weight:700;margin-left:2px;color:var(--ink-3)}
.gi-list{display:flex;flex-direction:column;gap:3px}
.gi{display:grid;grid-template-columns:minmax(0,auto) minmax(28px,1fr) auto;align-items:center;gap:6px;font-size:11px;color:var(--ink-2)}
.gi-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9.5em}
.gi-bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.gi-bar i{display:block;height:100%;border-radius:4px}
.gi-val{white-space:nowrap}
.gi-val b{font-family:var(--num);font-size:13px;color:var(--ink)}
.gi-val small{font-size:10.5px;color:var(--ink-3);margin-left:1px}
.goal-done{border-color:var(--gc);box-shadow:inset 0 0 0 1px var(--gc)}
.goal-next{margin-top:auto;font-size:11px;border-radius:6px;padding:3px 8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── ニュース ── */
.tabs{flex:1}
.tabs{display:flex;gap:5px;flex-wrap:nowrap;margin-left:10px;overflow-x:auto;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:3px 11px;border-radius:7px;border:1px solid var(--line);font-size:12px;font-weight:500;background:#fff;white-space:nowrap}
.tab:hover{border-color:var(--blue);color:var(--blue)}
.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.news-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:2px 14px 12px}
.news-card{border:1px solid var(--line);border-radius:var(--radius-m);padding:7px 9px;display:flex;gap:10px;align-items:flex-start;min-height:0;overflow:hidden;background:#fff}
.news-card:hover{border-color:#a9c6ef;background:var(--surface-2)}
.news-card:hover .nc-title{color:var(--blue-deep)}
.nc-thumb{width:52px;height:52px;border-radius:9px;flex-shrink:0;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-size:22px}
.nc-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.nc-meta{display:flex;align-items:center;gap:7px;min-width:0}
.nc-cat{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:5px;color:#fff;white-space:nowrap}
.nc-date{font-family:var(--num);font-size:11px;color:var(--ink-3);font-weight:600}
.nc-title{font-weight:700;font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc-src{flex:1;min-width:0;font-size:10.5px;color:var(--ink-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.news-empty{grid-column:1/-1;padding:28px;text-align:center;color:var(--ink-2);font-size:13px}
.nl-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.nl-item:hover .nl-title{color:var(--blue)}
.nl-title{font-weight:700;font-size:13.5px;line-height:1.45}
.nl-sub{grid-column:2;font-size:11.5px;color:var(--ink-3)}
.skeleton{background:linear-gradient(90deg,#eef3fa 25%,#f7faff 50%,#eef3fa 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}

/* ── 下段4列 ── */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:4px 6px;padding:0 12px 8px;align-content:start}
.tile{display:flex;align-items:center;gap:7px;height:34px;padding:0 7px 0 4px;border:1px solid var(--line);border-radius:9px;font-weight:700;font-size:12px;min-width:0;position:relative;background:#fff;scroll-snap-align:start}
.tile:hover{border-color:var(--blue);background:var(--surface-2)}
.tile-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.tile-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.tile-actions{position:absolute;top:50%;right:4px;transform:translateY(-50%);display:none;gap:2px}
.tile:hover .tile-actions,.tile:focus-within .tile-actions{display:flex}
.tile-actions button{width:20px;height:20px;border-radius:5px;background:#fff;border:1px solid var(--line);font-size:10px;display:grid;place-items:center;color:var(--ink-2)}
.tile-actions button:hover{color:var(--red);border-color:var(--red)}
.tile-add{justify-content:center;border-style:dashed;color:var(--blue);font-weight:700}
.head-btn{margin-left:auto;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--blue);color:#fff}
.head-btn:hover{background:var(--blue-deep)}
.head-btn.ghost{background:var(--blue-soft);color:var(--blue)}
.empty-note{padding:4px 16px 12px;font-size:12px;color:var(--ink-2)}
.todo-form{display:flex;gap:6px;padding:0 12px 6px;flex-shrink:0}
.todo-form input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px}
.todo-form input[type=time]{width:88px;border:1px solid var(--line);border-radius:8px;padding:4px 5px;font-size:12px}
.todo-form input:focus{outline:none;border-color:var(--blue)}
.todo-list{padding:0 8px 8px;display:flex;flex-direction:column;gap:0;max-height:300px;overflow-y:auto}
.todo-list .check-row{padding:5px 8px}
.todo-del{opacity:0;width:22px;height:22px;border-radius:6px;color:var(--ink-3);font-size:13px}
.check-row:hover .todo-del,.todo-del:focus-visible{opacity:1}
.todo-del:hover{color:var(--red);background:var(--red-soft)}

/* ── 入室画面（旧ポータルのデザインを継承） ── */
.lock{
  --ink:#1f2a3a;--ink-soft:#3d4f66;--ink-border:#9aa6b8;--blue:#2f86e8;--yellow:#ffe566;
  --coral:#ff6b7a;--muted:#6b7a90;--border-w:1.5px;--shadow-soft:0 2px 8px rgba(31,42,58,.06);
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;color:var(--ink);
  font-family:"Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.5;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:
    radial-gradient(circle at 18% 22%, rgba(255,229,102,.55) 0%, transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(62,198,232,.35) 0%, transparent 45%),
    radial-gradient(circle,rgba(31,42,58,.055) 1px,transparent 1.4px) 0 0/14px 14px,
    linear-gradient(145deg,#fff8d6 0%,#e8f4ff 48%,#fff1e0 100%)}
.lock.hidden{display:none}
.lock::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);
  animation:lockSheen 7s ease-in-out infinite}
@keyframes lockSheen{0%,100%{opacity:.35;transform:translateX(-8%)}50%{opacity:.7;transform:translateX(8%)}}
.lock-inner{position:relative;z-index:2;text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:400px;margin:auto;flex-shrink:0}
.lock-logo-txt{font-family:"Barlow Condensed","Noto Sans JP",sans-serif;font-weight:900;line-height:.88;margin-bottom:10px;transform:rotate(-1.5deg);filter:drop-shadow(0 2px 8px rgba(255,255,255,.65))}
.lock-logo-txt .fill{display:block;font-size:clamp(40px,10vw,84px);color:var(--coral);-webkit-text-stroke:1.5px var(--ink-border);paint-order:stroke fill}
.lock-logo-txt .outline{display:block;font-size:clamp(34px,8.5vw,70px);color:#fff;-webkit-text-stroke:1.5px var(--ink-border);paint-order:stroke fill}
.lock-logo-txt em{font-style:normal;color:var(--blue);-webkit-text-stroke:1.5px var(--ink-border)}
.lock-form{background:rgba(255,253,248,.96);border:var(--border-w) solid var(--ink-border);border-radius:14px;padding:20px 22px;box-shadow:0 8px 24px rgba(47,134,232,.16), 0 2px 6px rgba(31,42,58,.06);max-width:360px;width:100%;margin:0 auto;backdrop-filter:blur(6px)}
.lock-label{display:block;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px;text-align:left;font-weight:700}
.lock-input-wrap{display:flex;gap:8px;align-items:stretch}
.lock-input-wrap input{flex:1;min-width:0;border:var(--border-w) solid var(--ink-border);border-radius:8px;padding:11px 12px;font-size:16px;outline:none;background:#fff}
.lock-input-wrap input:focus{box-shadow:0 0 0 3px var(--yellow)}
.lock-btn{background:var(--blue);color:#fff;border:var(--border-w) solid var(--ink-border);border-radius:8px;padding:11px 14px;font-weight:800;font-size:14px;box-shadow:var(--shadow-soft);transition:background .15s,color .15s,transform .12s;white-space:nowrap;flex-shrink:0}
.lock-btn:hover{background:var(--yellow);color:var(--ink);transform:translateY(-1px)}
.lock-error{color:var(--coral);font-size:14px;margin-top:10px;opacity:0;font-weight:700}
.lock-error.show{opacity:1}
.lock-hint{margin-top:14px;font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;padding:0 8px;line-height:1.4}
@media (max-width:860px){
  .lock{align-items:flex-start;padding:max(16px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom))}
  .lock-inner{padding:8px 0 20px;gap:4px;min-height:calc(100dvh - 32px);justify-content:center;max-width:320px}
  .lock-logo-txt{margin-bottom:4px;transform:rotate(-1deg)}
  .lock-logo-txt .fill{font-size:42px;-webkit-text-stroke:1.2px var(--ink-border)}
  .lock-logo-txt .outline{font-size:34px;-webkit-text-stroke:1.2px var(--ink-border)}
  .lock-form{padding:14px 14px;border-radius:12px;max-width:100%}
  .lock-label{font-size:11px;letter-spacing:.08em;margin-bottom:6px}
  .lock-input-wrap{flex-direction:column;gap:8px;align-items:stretch}
  .lock-input-wrap input{padding:10px 12px;font-size:16px;width:100%}
  .lock-btn{width:100%;padding:10px 12px;font-size:14px;white-space:nowrap;line-height:1.2}
  .lock-hint{margin-top:10px;font-size:11px;line-height:1.45;white-space:normal}
}
@media (max-width:380px){
  .lock-logo-txt .fill{font-size:36px}
  .lock-logo-txt .outline{font-size:30px}
  .lock-hint{font-size:10px}
}

/* ── モーダル ── */
.modal-bg{position:fixed;inset:0;background:rgba(20,32,52,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:var(--radius-l);width:100%;max-width:440px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:16px;font-weight:900}
.modal-x{margin-left:auto;width:30px;height:30px;border-radius:8px;font-size:16px;color:var(--ink-2)}
.modal-x:hover{background:var(--surface-2)}
.modal-body{padding:16px 20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px}
.btn{padding:8px 18px;border-radius:9px;font-weight:700;font-size:13px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-deep)}
.btn-plain{background:var(--surface-2);color:var(--ink-2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px}
.field input:focus{outline:none;border-color:var(--blue)}
.field-err{color:var(--red);font-size:12px;min-height:18px}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-align:left;width:100%;font-weight:700;font-size:13.5px}
.pick:hover{border-color:var(--blue);background:var(--surface-2)}
.pick small{margin-left:auto;color:var(--ink-3);font-weight:500;font-size:11.5px}
.pick[disabled]{opacity:.5;cursor:default}
.back-btn{font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:10px}
.ann-full .ann-desc{display:block}

.overlay{position:fixed;inset:0;background:rgba(20,32,52,.4);z-index:35;display:none}
.overlay.open{display:block}


/* ── 1画面に収めるモード（幅1181px以上・高さ800px以上のPC） ──
   画面の高さに合わせて各段を伸び縮みさせ、中身が多い場合は枠の中だけスクロールします */
@media (min-width:1181px) and (min-height:800px){
  html,body{height:100%;overflow:hidden}
  .app{height:100vh}
  .content{height:100vh;overflow:hidden}
  /* 上段だけが画面の高さに合わせて伸び縮み。目標・ニュース・下段は中身ぴったりの高さ */
  main{flex:1;min-height:0;display:grid;padding:12px 16px 14px;gap:12px;
    grid-template-rows:minmax(0,1fr) auto auto auto}
  .row-top{min-height:0}
  .row-top > *{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .banner,.banner-inner{min-height:0}
  .ann-list,.rt-list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
  /* 下段：ボタン3段ぶん（34px×3＋すき間）を表示し、それ以上は枠内スクロール。途中で切れないよう段ごとに止まる */
  .row-tools > .panel{display:flex;flex-direction:column;overflow:hidden}
  .scroll-area{height:110px;overflow-y:auto;scrollbar-width:thin;scroll-snap-type:y mandatory;scroll-padding-top:0}
  .scroll-area > .tile-grid{padding-bottom:0}
  .tile-grid.scroll-area{padding-bottom:0}
  .todo-list{height:82px;max-height:none;scrollbar-width:thin}
  /* 枠内スクロールする欄は、下端をふんわり消して「続きがある」ことを示す */
  .ann-list,.rt-list,.todo-list{-webkit-mask-image:linear-gradient(#000 calc(100% - 16px),transparent);mask-image:linear-gradient(#000 calc(100% - 16px),transparent);padding-bottom:14px}
}
@media (min-width:1181px) and (min-height:800px) and (max-height:900px){
  .banner-title{-webkit-line-clamp:2;font-size:clamp(16px,1.25vw,19px)}
  .banner-top{margin-bottom:6px}
}

/* 高さの低いノートPCでは、メニューの行間を詰めて全項目が見えるように */
@media (min-width:861px) and (max-height:920px){
  .logo{padding:10px 16px 6px}
  .nav-link{padding:4px 12px;font-size:12.5px}
  .help{padding:8px 10px;margin:4px 10px 8px}
  .help-chat{margin-top:5px;padding:4px}
  .lock-now{margin:-2px 10px 8px;padding:3px}
}

/* ── レスポンシブ ── */
@media (max-width:1320px){
  .freq{display:none}
}
@media (max-width:1180px){
  .goal-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .row-tools{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row-top{grid-template-columns:1fr 1fr}
  .banner{grid-column:1/-1}
  .news-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;box-shadow:8px 0 30px rgba(0,0,0,.15)}
  .sidebar.open{transform:none}
  .sidebar-close{display:grid;place-items:center;position:absolute;right:10px;top:calc(14px + env(safe-area-inset-top,0px));width:32px;height:32px;border-radius:8px;font-size:16px}
  .burger{display:grid;place-items:center}
  .topbar{flex-wrap:wrap;padding-left:14px;padding-right:14px;gap:10px}
  .search-wrap{order:3;flex-basis:100%;max-width:none}
  .status{padding:6px 12px;gap:10px}
  .st-mid{padding:0 10px}
  .st-date{font-size:16px}
  .st-date small{font-size:12px}
  main{padding:14px 14px 32px;gap:14px}
  .row-top,.row-tools{grid-template-columns:1fr}
  .goal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .banner-inner{max-width:100%;padding:20px 20px 40px}
  .banner-shade{background:linear-gradient(90deg,rgba(12,44,104,.9) 0%,rgba(14,56,128,.7) 60%,rgba(20,70,150,.35) 100%)}
  .banner-nav{display:none}
  .goals .p-head{flex-wrap:wrap}
  .goal-month{margin-left:0;width:100%}
  .news .p-head{flex-wrap:wrap}
  .tabs{margin-left:0;width:100%;flex:none;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
  .tab{white-space:nowrap}
}
@media (max-width:560px){
  .goal-grid,.news-grid{grid-template-columns:1fr}
}

<body>
<!-- 入室画面 -->
<div class="lock" id="lock">
  <div class="lock-inner">
    <div class="lock-logo-txt">
      <span class="fill">三島</span>
      <span class="outline">ポー<em>タル</em></span>
    </div>
    <div class="lock-form" id="lock-form">
      <label class="lock-label" for="lock-input">パスワード入力</label>
      <div class="lock-input-wrap">
        <input id="lock-input" type="password" placeholder="パスワードを入力..." autocomplete="off">
        <button class="lock-btn" id="lock-btn" type="button">入室 ↗</button>
      </div>
      <div class="lock-error" id="lock-error" role="alert">⚠ パスワードが違います</div>
    </div>
    <div class="lock-hint">スタッフ専用ポータル · パスワードで入室</div>
  </div>
</div>
<script>try{ if(sessionStorage.getItem('mishima_portal_auth')==='1') document.getElementById('lock').classList.add('hidden'); }catch(e){}</script>

<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="メニュー">
    <button class="sidebar-close" id="sidebar-close" aria-label="メニューを閉じる">✕</button>
    <div class="logo">
      <div class="logo-mark">M</div>
      <div class="logo-text">三島<span>ポータル</span></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="help">
      <div class="help-q"><i>?</i>お困りですか？</div>
      <div class="help-who" id="help-who"></div>
      <a class="help-chat" id="help-chat" href="#" target="_blank" rel="noopener">チャットで相談</a>
    </div>
    <button class="lock-now" id="lock-now" type="button">🔒 ポータルをロック</button>
  </nav>
  <div class="overlay" id="overlay"></div>
  <div class="flyout" id="flyout"></div>

  <div class="content">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="メニューを開く">☰</button>
      <div class="search-wrap">
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="search-input" placeholder="リンク・資料・ツール・お知らせを検索（例：日次報告）" autocomplete="off" aria-label="ポータル内を検索">
          <button class="search-btn" id="search-btn">検索</button>
        </div>
        <div class="search-results" id="search-results" role="listbox"></div>
      </div>
      <div class="freq">
        <div class="freq-label">よく検索されるワード</div>
        <div class="freq-chips" id="freq-chips"></div>
      </div>
      <div class="status">
        <div class="weather" title="三島市の現在の天気"><span id="w-icon">☀️</span><span id="w-temp">--°C</span></div>
        <div class="st-mid"><div class="st-date" id="st-date"></div></div>
        <div class="clock" id="clock">--:--</div>
      </div>
    </header>

    <main>
      <!-- 上段：Appleニュースバナー / 重要なお知らせ / ルーティンチェックリスト -->
      <section class="row-top">
        <div class="banner" id="banner" aria-roledescription="カルーセル" aria-label="Apple注目ニュース">
          <img class="banner-img" id="banner-img" alt="" hidden>
          <div class="banner-deco" id="banner-deco"></div>
          <div class="banner-shade"></div>
          <div class="banner-inner">
            <div class="banner-top"><div class="banner-tag">🍎 Apple 注目ニュース</div><div class="banner-meta" id="banner-meta"></div></div>
            <div class="banner-title" id="banner-title">ニュースを読み込んでいます…</div>
            <div class="banner-desc" id="banner-desc"></div>
            <a class="banner-btn" id="banner-btn" href="https://www.apple.com/jp/newsroom/" target="_blank" rel="noopener">詳しく見る</a>
          </div>
          <button class="banner-nav prev" id="banner-prev" aria-label="前のニュース">‹</button>
          <button class="banner-nav next" id="banner-next" aria-label="次のニュース">›</button>
          <div class="banner-dots" id="banner-dots"></div>
          <div class="banner-src">出典：Apple Newsroom</div>
        </div>

        <div class="panel announce">
          <div class="p-head">
            <div class="p-title"><span class="ico">🔔</span>重要なお知らせ</div>
            <button class="p-link" id="ann-all">すべて見る ›</button>
          </div>
          <div class="ann-list" id="ann-list"></div>
        </div>

        <div class="panel routine">
          <div class="p-head">
            <div class="p-title"><span class="ico">✅</span>毎日のルーティン</div>
            <div class="routine-date" id="routine-date"></div>
          </div>
          <div class="rt-progress">
            <div class="rt-count" id="rt-count">0<small> / 0</small></div>
            <div class="rt-bar"><div id="rt-bar" style="width:0%"></div></div>
            <div class="rt-msg" id="rt-msg"></div>
          </div>
          <div class="rt-list" id="rt-list"></div>
        </div>
      </section>

      <!-- 中段：目標・指標（ダミー） -->
      <section class="panel goals">
        <div class="p-head">
          <div class="p-title">🏆 三島BASEの目標・指標</div>
          <span class="dummy-badge" id="goal-dummy">ダミー表示</span>
          <div class="goal-month" id="goal-month"></div>
        </div>
        <div class="goal-grid" id="goal-grid"></div>
      </section>

      <!-- ニュース -->
      <section class="panel news">
        <div class="p-head">
          <div class="p-title"><span class="ico">📰</span>DLPに役立つニュース</div>
          <div class="tabs" id="news-tabs" role="tablist"></div>
          <button class="p-link" id="news-all">一覧を見る ›</button>
        </div>
        <div class="news-grid" id="news-grid"></div>
      </section>

      <!-- 下段：よく使うツール / お気に入り / ショートカット / Todo -->
      <section class="row-tools">
        <div class="panel">
          <div class="p-head"><div class="p-title"><span class="ico">🧰</span>よく使うツール</div></div>
          <div class="tile-grid scroll-area" id="tools-grid"></div>
        </div>
        <div class="panel">
          <div class="p-head">
            <div class="p-title"><span class="ico">⭐</span>お気に入り</div>
            <button class="head-btn ghost" id="fav-add">＋ 追加</button>
          </div>
          <div class="scroll-area" id="fav-wrap"></div>
        </div>
        <div class="panel">
          <div class="p-head">
            <div class="p-title"><span class="ico">⚡</span>ショートカット</div>
            <button class="head-btn ghost" id="sc-add">＋ 追加</button>
          </div>
          <div class="scroll-area" id="sc-wrap"></div>
        </div>
        <div class="panel">
          <div class="p-head"><div class="p-title"><span class="ico">📝</span>Todoリスト</div></div>
          <form class="todo-form" id="todo-form">
            <input type="text" id="todo-text" placeholder="やることを入力" maxlength="80" aria-label="Todoの内容">
            <input type="time" id="todo-time" aria-label="時刻（任意）">
            <button class="head-btn" type="submit" style="margin-left:0">追加</button>
          </form>
          <div class="todo-list" id="todo-list"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- モーダル：お気に入り追加 -->
<div class="modal-bg" id="fav-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="fav-modal-title">
    <div class="modal-head"><h2 id="fav-modal-title">お気に入りを追加</h2><button class="modal-x" data-close="fav-modal" aria-label="閉じる">✕</button></div>
    <div class="modal-body" id="fav-modal-body"></div>
  </div>
</div>

<!-- モーダル：ショートカット追加・編集 -->
<div class="modal-bg" id="sc-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sc-modal-title">
    <div class="modal-head"><h2 id="sc-modal-title">ショートカットを追加</h2><button class="modal-x" data-close="sc-modal" aria-label="閉じる">✕</button></div>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
  keys(){ try{ return Object.keys(localStorage); }catch(e){ return []; } },
};
const WEEK = ['日','月','火','水','木','金','土'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDate = d => d && !isNaN(d) ? `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}` : '';
const isLive = u => !!u && u !== '#';
const safeUrl = u => /^(https?:\/\/|#|\.\/|\/)/i.test(u||'') ? u : '#';
const checkSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
function openModal(id){ $(id).classList.add('open'); }
function closeModal(id){ $(id).classList.remove('open'); }
document.addEventListener('click', e => { const c = e.target.closest('[data-close]'); if(c) closeModal(c.dataset.close); if(e.target.classList.contains('modal-bg')) e.target.classList.remove('open'); });
document.addEventListener('keydown', e => { if(e.key==='Escape'){ document.querySelectorAll('.modal-bg.open').forEach(m=>m.classList.remove('open')); hideFlyout(); } });

/* ───────── サイドバー ───────── */
function renderNav(){
  const home = `<div class="nav-item"><button class="nav-link active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span class="nav-ico">🏠</span>ホーム</button></div>`;
  $('nav').innerHTML = home + CATEGORIES.map(c =>
    `<div class="nav-item"><button class="nav-link" data-cat="${c.id}" aria-haspopup="true"><span class="nav-ico">${c.icon}</span>${esc(c.name)}</button></div>`).join('');
  $('nav').querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('mouseenter', () => { if(matchMedia('(hover:hover)').matches) showFlyout(btn); });
    btn.addEventListener('mouseleave', scheduleHide);
    btn.addEventListener('click', () => { const f=$('flyout'); if(f.classList.contains('open') && f.dataset.cat===btn.dataset.cat) hideFlyout(); else showFlyout(btn); });
  });
  $('help-who').innerHTML = `<b>${esc(HELP.name)}</b>`;
  $('help-chat').href = safeUrl(HELP.chatUrl);
}
let hideTimer;
function showFlyout(btn){
  clearTimeout(hideTimer);
  const c = CATEGORIES.find(x => x.id === btn.dataset.cat); if(!c) return;
  const f = $('flyout'); f.dataset.cat = c.id;
  f.innerHTML = `<div class="flyout-title">${c.icon} ${esc(c.name)}</div>` +
    (c.links.length ? c.links.map(l => isLive(l.url)
      ? `<a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.name)}</a>`
      : `<span class="fly-off" title="リンク準備中">${esc(l.name)}</span>`).join('') : '<div class="flyout-title">リンクはまだありません</div>');
  f.classList.add('open');
  const r = btn.getBoundingClientRect();
  const left = Math.min(r.right + 6, innerWidth - f.offsetWidth - 8);
  const top = Math.max(8, Math.min(r.top, innerHeight - f.offsetHeight - 8));
  f.style.left = left + 'px'; f.style.top = top + 'px';
}
function scheduleHide(){ hideTimer = setTimeout(hideFlyout, 180); }
function hideFlyout(){ $('flyout').classList.remove('open'); }
$('flyout').addEventListener('mouseenter', () => clearTimeout(hideTimer));
$('flyout').addEventListener('mouseleave', scheduleHide);
function openMenu(){ $('sidebar').classList.add('open'); $('overlay').classList.add('open'); }
function closeMenu(){ $('sidebar').classList.remove('open'); $('overlay').classList.remove('open'); hideFlyout(); }
$('burger').onclick = openMenu; $('sidebar-close').onclick = closeMenu; $('overlay').onclick = closeMenu;
document.addEventListener('click', e => { if(!e.target.closest('#flyout') && !e.target.closest('[data-cat]')) hideFlyout(); });

/* ───────── ルーティン（毎日リセット） ───────── */
function routineKey(){ return 'mishima_routine_' + ymd(new Date()); }
function renderRoutine(){
  const key = routineKey();
  store.keys().filter(k => k.startsWith('mishima_routine_') && k !== key).forEach(k => store.del(k));
  const done = new Set(store.get(key, []));
  const d = new Date();
  $('routine-date').textContent = `${d.getMonth()+1}月${d.getDate()}日（${WEEK[d.getDay()]}）`;
  $('rt-list').innerHTML = ROUTINES.map(r => `
    <label class="check-row"><input type="checkbox" data-id="${esc(r.id)}" ${done.has(r.id)?'checked':''}>
      <span class="box">${checkSvg}</span><span class="check-text">${esc(r.title)}</span><span class="check-time">${esc(r.time||'')}</span></label>`).join('');
  $('rt-list').querySelectorAll('input').forEach(inp => inp.onchange = () => {
    const s = new Set(store.get(routineKey(), []));
    inp.checked ? s.add(inp.dataset.id) : s.delete(inp.dataset.id);
    store.set(routineKey(), [...s]); updateRoutineProgress();
  });
  updateRoutineProgress();
}
function updateRoutineProgress(){
  const ids = new Set(ROUTINES.map(r => r.id));
  const n = store.get(routineKey(), []).filter(id => ids.has(id)).length, t = ROUTINES.length;
  $('rt-count').innerHTML = `${n}<small> / ${t}</small>`;
  $('rt-bar').style.width = (t ? n/t*100 : 0) + '%';
  const m = $('rt-msg'); m.title = 'チェックは日付が変わると自動でリセットされます';
  if(t && n === t){ m.textContent = 'すべて完了！'; m.classList.add('done'); }
  else { m.textContent = `残り ${t-n} 件`; m.classList.remove('done'); }
}

/* ───────── 目標・指標（ダミー） ───────── */
const isBlank = v => v === null || v === undefined || v === '';
function calcGoal(g){
  if(g.items.some(it => isBlank(it.value))){
    const tgt = g.lowerIsBetter ? `目標 ${g.items[0].target}${g.items[0].unit}以下`
      : '目標 ' + g.items.map(it => `${it.target}${it.unit}`).join('・');
    return { done:false, pending:true, pct:0, big:'—', small:tgt, next:'実績は集計中です' };
  }
  if(g.lowerIsBetter){
    const it = g.items[0], v = Number(it.value), t = Number(it.target);
    const done = v <= t;
    const pct = done ? 100 : Math.max(0, Math.round(t / v * 100));
    const gap = Math.round((v - t) * 100) / 100;
    return { done, pct, big:`${v}${it.unit}`, small:`目標 ${t}${it.unit}以下`,
      next: done ? '目標達成中！この調子で維持しましょう' : `あと${gap}pt下げると目標達成` };
  }
  const total = g.items.reduce((s, it) => s + Number(it.target), 0);
  const got = g.items.reduce((s, it) => s + Math.min(Number(it.value), Number(it.target)), 0);
  const pct = total ? Math.round(got / total * 100) : 0;
  const done = got >= total;
  const unit = g.items[0].unit;
  return { done, pct, big:`${pct}%`, small:'達成率',
    next: done ? '目標達成！おつかれさまです' : `目標まであと${g.items.length > 1 ? '合計' : ''}${total - got}${unit}` };
}
function renderGoals(){
  const d = new Date();
  $('goal-month').textContent = `${d.getFullYear()}年${d.getMonth()+1}月の状況（${GOALS_SETTINGS.updated.slice(5).replace('.', '/')} 更新）`;
  $('goal-dummy').hidden = !GOALS_SETTINGS.isDummy;
  $('goal-grid').innerHTML = GOALS.map(g => {
    const r = calcGoal(g);
    const rows = g.items.map(it => {
      const blank = isBlank(it.value);
      const p = blank ? 0 : g.lowerIsBetter ? r.pct : Math.min(100, Math.round(it.value / it.target * 100));
      const tgt = g.lowerIsBetter ? `<small> / 目標${it.target}${esc(it.unit)}以下</small>` : `<small>/${it.target}${esc(it.unit)}</small>`;
      const val = blank ? '—' : g.lowerIsBetter ? `${it.value}${esc(it.unit)}` : it.value;
      return `<div class="gi" title="${esc(it.label)}：${blank ? '未入力' : it.value + esc(it.unit)}（目標 ${it.target}${esc(it.unit)}${g.lowerIsBetter ? '以下' : ''}）">
        <span class="gi-label">${esc(it.label)}</span>
        <span class="gi-bar" role="progressbar" aria-label="${esc(it.label)}" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%;background:${g.color}"></i></span>
        <span class="gi-val"><b>${val}</b>${tgt}</span></div>`;
    }).join('');
    return `<div class="goal${r.done ? ' goal-done' : ''}" style="--gc:${g.color}">
      <div class="goal-top"><div class="goal-ico" style="background:${g.color}">${g.icon}</div>
        <div><div class="goal-name" style="color:${g.color}">${esc(g.name)}</div><div class="goal-sub"><span class="goal-period" style="color:${g.color};background:${g.soft}">${esc(g.period || '今月')}</span>${esc(g.sub)}</div></div>
        <div class="goal-big" style="color:${g.color}" title="${esc(r.small)}">${esc(r.big)}<small>${g.lowerIsBetter || r.pending ? '' : '達成'}</small></div></div>
      <div class="gi-list">${rows}</div>
      <div class="goal-next" style="background:${g.soft};color:${g.color}" title="${esc(r.next)}">${r.done ? '🎉 ' : ''}${esc(r.next)}</div>
    </div>`;
  }).join('');
}

/* ───────── ニュース取得 ─────────
   1) Cloudflare Pages Functions（/api/rss）経由で取得 … 本番用
   2) 失敗したら rss2json 経由 … 現行サイトと同じ方法
   3) それも失敗したらサンプル表示                                    */
function textOf(el, sel){ const n = el.querySelector(sel); return n ? n.textContent.trim() : ''; }
function stripHtml(s){ const d = document.createElement('div'); d.innerHTML = s || ''; return (d.textContent || '').replace(/\s+/g,' ').trim(); }
function parseFeedXml(xml, fallbackSource){
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  if(doc.querySelector('parsererror')) return null;
  const out = [];
  doc.querySelectorAll('item').forEach(it => {
    const enc = it.querySelector('enclosure[type^="image"]') || it.getElementsByTagName('media:content')[0] || it.getElementsByTagName('media:thumbnail')[0];
    out.push({ title:textOf(it,'title'), link:textOf(it,'link'), date:new Date(textOf(it,'pubDate') || textOf(it,'date')),
      desc:stripHtml(textOf(it,'description')), image:enc ? enc.getAttribute('url') : '', source:textOf(it,'source') || fallbackSource });
  });
  doc.querySelectorAll('entry').forEach(en => {
    const alt = [...en.querySelectorAll('link')].find(l => !l.getAttribute('rel') || l.getAttribute('rel')==='alternate');
    const img = en.querySelector('link[rel="enclosure"]');
    out.push({ title:textOf(en,'title'), link:alt ? alt.getAttribute('href') : '', date:new Date(textOf(en,'updated') || textOf(en,'published')),
      desc:stripHtml(textOf(en,'content') || textOf(en,'summary')), image:img ? img.getAttribute('href') : '', source:fallbackSource });
  });
  return out;
}
async function fetchFeed(src){
  try{
    const r = await fetch('/api/rss?url=' + encodeURIComponent(src.url));
    if(r.ok){ const t = await r.text(); if(t.trim().startsWith('<')){ const items = parseFeedXml(t, src.label); if(items && items.length) return items; } }
  }catch(e){}
  try{
    const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(src.url));
    const j = await r.json();
    if(j.status === 'ok' && j.items && j.items.length){
      return j.items.map(it => ({ title:it.title, link:it.link, date:new Date((it.pubDate||'').replace(' ','T') + 'Z'),
        desc:stripHtml(it.description||it.content), image:it.thumbnail || (it.enclosure && it.enclosure.link) || '', source:j.feed && j.feed.title || src.label }));
    }
  }catch(e){}
  return null;
}
function cleanItem(it, src){
  let title = (it.title || '').trim(), source = it.source || src.label;
  const m = title.match(/^(.*)\s+-\s+([^-]{1,30})$/);   // Googleニュースの「タイトル - 媒体名」
  if(m && src.url.includes('news.google.com')){ title = m[1]; source = m[2]; }
  let desc = it.desc || '';
  if(src.url.includes('news.google.com')) desc = '';     // Googleニュースの本文はタイトルの繰り返しのため省略
  return { ...it, title, desc, source, srcId:src.id };
}
function sampleItems(src){
  const now = Date.now();
  return [1,2,3,4].map(i => ({ title:`【サンプル】${src.label}の記事タイトルがここに入ります（${i}）`, link:'#', date:new Date(now - i*86400000),
    desc:'ニュースを取得できなかったため、サンプルを表示しています。本番環境では最新記事が表示されます。', image:'', source:'サンプル', srcId:src.id, sample:true }));
}
const newsData = {};  // srcId -> items
async function loadAllNews(){
  await Promise.all(NEWS_SOURCES.map(async src => {
    const raw = await fetchFeed(src);
    newsData[src.id] = raw
      ? raw.map(it => cleanItem(it, src)).filter(it => it.title && !NEWS_BLOCKLIST.some(w => (it.title+it.desc).includes(w)))
           .sort((a,b) => (b.date||0) - (a.date||0))
      : sampleItems(src);
    if(src.id === 'apple') setupBanner();
    renderNews();
  }));
}

/* ───────── バナー ───────── */
let bannerItems = [], bannerIdx = 0, bannerTimer = null;
function setupBanner(){
  const all = newsData.apple || [];
  const kw = BANNER.keywords.map(k => k.toLowerCase());
  bannerItems = all.filter(it => it.sample || kw.some(k => (it.title + ' ' + it.desc).toLowerCase().includes(k))).slice(0, BANNER.maxItems);
  if(!bannerItems.length) bannerItems = all.slice(0, BANNER.maxItems);
  bannerIdx = 0;
  $('banner-dots').innerHTML = bannerItems.map((_,i) => `<button aria-label="${i+1}件目を表示"></button>`).join('');
  $('banner-dots').querySelectorAll('button').forEach((b,i) => b.onclick = () => { bannerIdx = i; showBanner(); restartBanner(); });
  if(BANNER.imageMode === 'fixed') setBannerImage(BANNER.fixedImage);
  showBanner(); restartBanner();
}
function setBannerImage(src){
  const img = $('banner-img');
  if(!src){ img.hidden = true; $('banner-deco').hidden = false; return; }
  img.onload = () => { img.hidden = false; $('banner-deco').hidden = true; };
  img.onerror = () => { img.hidden = true; $('banner-deco').hidden = false; };
  if(img.getAttribute('src') !== src) img.src = src;
}
function showBanner(){
  const it = bannerItems[bannerIdx]; if(!it) return;
  $('banner-title').textContent = it.title;
  $('banner-desc').textContent = it.desc;
  $('banner-meta').textContent = fmtDate(it.date);
  $('banner-btn').href = safeUrl(it.link);
  if(BANNER.imageMode === 'article') setBannerImage(it.image);
  $('banner-dots').querySelectorAll('button').forEach((b,i) => b.classList.toggle('on', i === bannerIdx));
}
function stepBanner(n){ if(!bannerItems.length) return; bannerIdx = (bannerIdx + n + bannerItems.length) % bannerItems.length; showBanner(); }
function restartBanner(){ clearInterval(bannerTimer); if(bannerItems.length > 1 && !matchMedia('(prefers-reduced-motion:reduce)').matches) bannerTimer = setInterval(() => stepBanner(1), BANNER.intervalSec*1000); }
$('banner-prev').onclick = () => { stepBanner(-1); restartBanner(); };
$('banner-next').onclick = () => { stepBanner(1); restartBanner(); };
$('banner').addEventListener('mouseenter', () => clearInterval(bannerTimer));
$('banner').addEventListener('mouseleave', restartBanner);

/* ───────── ニュース欄 ───────── */
let newsTab = 'all';
const NEWS_CARDS = 4;
const TABS = [{id:'all',label:'すべて'}, ...NEWS_SOURCES.map(s => ({id:s.id,label:s.label})), {id:'tips',label:'会員対応のヒント'}];
function renderTabs(){
  $('news-tabs').innerHTML = TABS.map(t => `<button class="tab" role="tab" aria-selected="${t.id===newsTab}" data-tab="${t.id}">${esc(t.label)}</button>`).join('');
  $('news-tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { newsTab = b.dataset.tab; renderTabs(); renderNews(); });
}
function currentNews(){
  if(newsTab === 'tips') return TIPS.map(t => ({ title:t.title, desc:t.desc, link:t.url, date:new Date(t.date.replace(/\./g,'-')), source:'店舗より', srcId:'tips' }));
  if(newsTab === 'all'){
    // 各タブから新しい順に交互に並べる（1つの話題に偏らないように）
    const lists = NEWS_SOURCES.map(s => (newsData[s.id] || []).filter(x => !x.sample));
    const out = []; for(let i = 0; i < 10; i++) lists.forEach(l => { if(l[i]) out.push(l[i]); });
    return out.length ? out : NEWS_SOURCES.flatMap(s => (newsData[s.id]||[]).slice(0,1));
  }
  return newsData[newsTab];
}
function renderNews(){
  const list = currentNews();
  const grid = $('news-grid');
  if(!list){ grid.innerHTML = Array(NEWS_CARDS).fill('<div class="news-card"><div class="skeleton" style="width:58px;height:58px;flex-shrink:0"></div><div class="nc-main"><div class="skeleton" style="height:14px;width:40%"></div><div class="skeleton" style="height:30px"></div></div></div>').join(''); return; }
  if(!list.length){ grid.innerHTML = '<div class="news-empty">このタブの記事はまだありません。</div>'; return; }
  const shown = list.slice(0, NEWS_CARDS);
  grid.innerHTML = shown.map(it => {
    const src = srcOf(it);
    const thumb = it.image
      ? `<img class="nc-thumb" src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;nc-thumb&quot;>${src.icon}</div>'">`
      : `<div class="nc-thumb" style="background:${src.color}14">${src.icon}</div>`;
    return `<a class="news-card" href="${esc(safeUrl(it.link))}" target="_blank" rel="noopener" title="${esc(it.title)}">${thumb}
      <div class="nc-main"><div class="nc-meta"><span class="nc-cat" style="background:${src.color}">${esc(src.label)}</span><span class="nc-date">${fmtDate(it.date)}</span><span class="nc-src">${esc(it.source)}</span></div>
        <div class="nc-title">${esc(it.title)}</div></div></a>`;
  }).join('');
  // 画像がない記事は、記事ページの代表画像を探して差し込む（公開環境のみ）
  grid.querySelectorAll('.news-card').forEach((card, i) => {
    const it = shown[i];
    if(!it || it.image || it.sample || !isLive(it.link)) return;
    fetchOgImage(it.link).then(img => {
      if(!img) return;
      it.image = img;
      const old = card.querySelector('.nc-thumb');
      if(!card.isConnected || !old) return;
      const im = document.createElement('img');
      im.className = 'nc-thumb'; im.alt = ''; im.referrerPolicy = 'no-referrer';
      im.onerror = () => { it.image = ''; im.replaceWith(old); };
      im.src = img; old.replaceWith(im);
    });
  });
}
const ogCache = new Map();
function fetchOgImage(link){
  if(!ogCache.has(link)){
    ogCache.set(link, fetch('/api/ogimage?url=' + encodeURIComponent(link))
      .then(r => r.ok ? r.json() : {}).then(j => (j && j.image) || '').catch(() => ''));
  }
  return ogCache.get(link);
}
function srcOf(it){ return NEWS_SOURCES.find(s => s.id === it.srcId) || { label:'会員対応のヒント', color:'#0e8fb8', icon:'💡' }; }
$('news-all').onclick = () => {
  const list = currentNews() || [], tab = TABS.find(t => t.id === newsTab);
  $('news-modal-title').textContent = `ニュース一覧（${tab.label}）`;
  $('news-modal-body').innerHTML = list.length ? list.map(it => { const src = srcOf(it);
    return `<a class="nl-item" href="${esc(safeUrl(it.link))}" target="_blank" rel="noopener">
      <span class="nc-cat" style="background:${src.color};align-self:start;margin-top:2px">${esc(src.label)}</span>
      <span class="nl-title">${esc(it.title)}</span><span class="nl-sub">${fmtDate(it.date)}　出典：${esc(it.source)}</span></a>`; }).join('')
    : '<div class="news-empty">このタブの記事はまだありません。</div>';
  openModal('news-modal');
};

/* ───────── よく使うツール ───────── */
function tileHtml(t, actions=''){
  return `<a class="tile" href="${esc(safeUrl(t.url))}" target="_blank" rel="noopener" title="${esc(t.name)}">
    <span class="tile-ico" style="background:${t.color ? t.color+'1a' : 'var(--blue-soft)'}">${esc(t.icon || '🔗')}</span><span class="tile-name">${esc(t.name)}</span>${actions}</a>`;
}
function renderTools(){ $('tools-grid').innerHTML = TOOLS.map(t => tileHtml(t)).join(''); }

/* ───────── お気に入り（メニューのリンクから選ぶ） ─────────
   ※ 旧ポータルの「お気に入り」と同じ保存場所なので、登録済みの内容はそのまま引き継がれます */
const FAV_KEY = 'mishima_portal_shortcuts';
let favorites = store.get(FAV_KEY, DEFAULT_FAVORITES.slice());
if(!Array.isArray(favorites)) favorites = DEFAULT_FAVORITES.slice();
favorites = favorites.filter(f => f && f.name && isLive(f.url));
function renderFavorites(){
  if(!favorites.length){ $('fav-wrap').innerHTML = '<div class="empty-note">メニュー内のリンクから、よく開くものを登録できます。</div>'; return; }
  $('fav-wrap').innerHTML = '<div class="tile-grid">' + favorites.map((f,i) =>
    tileHtml({ name:f.name, url:f.url, icon:f.icon }, `<span class="tile-actions"><button data-fav-del="${i}" aria-label="${esc(f.name)}を削除">✕</button></span>`)
  ).join('') + '</div>';
  $('fav-wrap').querySelectorAll('[data-fav-del]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); favorites.splice(+b.dataset.favDel,1); store.set(FAV_KEY, favorites); renderFavorites(); });
}
function favStep1(){
  $('fav-modal-body').innerHTML = '<div class="pick-list">' + CATEGORIES.map(c =>
    `<button class="pick" data-c="${c.id}"><span>${c.icon}</span>${esc(c.name)}<small>${c.links.filter(l => isLive(l.url)).length}件</small></button>`).join('') + '</div>';
  $('fav-modal-body').querySelectorAll('[data-c]').forEach(b => b.onclick = () => favStep2(b.dataset.c));
}
function favStep2(catId){
  const c = CATEGORIES.find(x => x.id === catId);
  $('fav-modal-body').innerHTML = `<button class="back-btn" id="fav-back">‹ カテゴリ選択に戻る</button><div class="pick-list">` +
    c.links.map((l,i) => { const has = favorites.some(f => f.url === l.url), live = isLive(l.url);
      return `<button class="pick" data-li="${i}" ${has || !live ? 'disabled' : ''}>${esc(l.name)}<small>${!live ? '整備中' : has ? '登録済み' : '追加する'}</small></button>`; }).join('') + '</div>';
  $('fav-back').onclick = favStep1;
  $('fav-modal-body').querySelectorAll('[data-li]').forEach(b => b.onclick = () => {
    const l = c.links[+b.dataset.li];
    favorites.push({ name:l.name, sub:c.name, url:l.url, icon:c.icon }); store.set(FAV_KEY, favorites); renderFavorites(); closeModal('fav-modal');
  });
}
$('fav-add').onclick = () => { favStep1(); openModal('fav-modal'); };

/* ───────── ショートカット（自由登録） ───────── */
// ※ 旧ポータルの「ショートカット」と同じ保存場所なので、登録済みの内容はそのまま引き継がれます
const SC_KEY = 'mishima_portal_quick_access';
let shortcuts = store.get(SC_KEY, DEFAULT_SHORTCUTS.slice());
if(!Array.isArray(shortcuts)) shortcuts = DEFAULT_SHORTCUTS.slice();
shortcuts = shortcuts.filter(s => s && s.name && s.name !== '未設定' && isLive(s.url));
let scEditing = -1;
function renderShortcuts(){
  if(!shortcuts.length){ $('sc-wrap').innerHTML = '<div class="empty-note">よく開くサイトを名前・URLで登録できます。</div>'; return; }
  $('sc-wrap').innerHTML = '<div class="tile-grid">' + shortcuts.map((s,i) => tileHtml(s,
    `<span class="tile-actions"><button data-sc-edit="${i}" aria-label="${esc(s.name)}を編集">✎</button><button data-sc-del="${i}" aria-label="${esc(s.name)}を削除">✕</button></span>`)).join('') + '</div>';
  $('sc-wrap').querySelectorAll('[data-sc-del]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); shortcuts.splice(+b.dataset.scDel,1); store.set(SC_KEY, shortcuts); renderShortcuts(); });
  $('sc-wrap').querySelectorAll('[data-sc-edit]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); openScModal(+b.dataset.scEdit); });
}
function openScModal(i = -1){
  scEditing = i; const s = shortcuts[i] || { name:'', url:'', icon:'' };
  $('sc-modal-title').textContent = i >= 0 ? 'ショートカットを編集' : 'ショートカットを追加';
  $('sc-name').value = s.name; $('sc-url').value = s.url; $('sc-icon').value = s.icon; $('sc-err').textContent = '';
  openModal('sc-modal'); setTimeout(() => $('sc-name').focus(), 50);
}
$('sc-add').onclick = () => openScModal();
$('sc-save').onclick = () => {
  const name = $('sc-name').value.trim(), url = $('sc-url').value.trim(), icon = $('sc-icon').value.trim() || '🔗';
  if(!name) return $('sc-err').textContent = '名前を入力してください';
  if(!/^https?:\/\//i.test(url)) return $('sc-err').textContent = 'URLは https:// から入力してください';
  const item = { name, url, icon };
  scEditing >= 0 ? shortcuts[scEditing] = item : shortcuts.push(item);
  store.set(SC_KEY, shortcuts); renderShortcuts(); closeModal('sc-modal');
};

/* ───────── Todo ───────── */
// ※ 旧ポータルのTodoと同じ保存場所なので、登録済みのTodoはそのまま引き継がれます
const TODO_KEY = 'mishima_portal_todos';
let todos = store.get(TODO_KEY, []);
if(!Array.isArray(todos)) todos = [];
function renderTodos(){
  const sorted = todos.map((t,i) => ({...t,i})).sort((a,b) => (a.time||'99') < (b.time||'99') ? -1 : (a.time||'99') > (b.time||'99') ? 1 : a.i - b.i);
  $('todo-list').innerHTML = sorted.length ? sorted.map(t => `
    <label class="check-row"><input type="checkbox" data-i="${t.i}" ${t.done?'checked':''}>
      <span class="box">${checkSvg}</span><span class="check-text">${esc(t.text || '')}</span><span class="check-time">${esc(t.time||'')}</span>
      <button class="todo-del" data-del="${t.i}" aria-label="${esc(t.text)}を削除">✕</button></label>`).join('')
    : '<div class="empty-note" style="padding:6px 8px">今日のやることを追加しましょう。時刻は空欄でもOKです。</div>';
  $('todo-list').querySelectorAll('input').forEach(inp => inp.onchange = () => { todos[+inp.dataset.i].done = inp.checked; store.set(TODO_KEY, todos); });
  $('todo-list').querySelectorAll('[data-del]').forEach(b => b.onclick = e => { e.preventDefault(); todos.splice(+b.dataset.del,1); store.set(TODO_KEY, todos); renderTodos(); });
}
$('todo-form').onsubmit = e => {
  e.preventDefault();
  const text = $('todo-text').value.trim(); if(!text) return $('todo-text').focus();
  // 「監査勉強」と入力すると専用ページへ移動（Todoには追加しない）
  if(text === '監査勉強'){ $('todo-text').value = ''; location.href = 'https://kansa-site.suzukitaka.workers.dev/'; return; }
  todos.push({ text, time:$('todo-time').value, done:false, id:Date.now() }); store.set(TODO_KEY, todos);
  $('todo-text').value = ''; $('todo-time').value = ''; renderTodos();
};

/* ───────── 全体検索 ───────── */
function searchIndex(){
  const idx = [];
  CATEGORIES.forEach(c => c.links.forEach(l => idx.push({ kind:c.name, name:l.name, sub:'メニュー', url:l.url })));
  TOOLS.forEach(t => idx.push({ kind:'ツール', name:t.name, sub:'よく使うツール', url:t.url }));
  shortcuts.forEach(s => idx.push({ kind:'ショートカット', name:s.name, sub:s.url, url:s.url }));
  ANNOUNCEMENTS.forEach(a => idx.push({ kind:'お知らせ', name:a.title, sub:a.date, action:'ann' }));
  return idx;
}
let srFocus = -1, srList = [];
function runSearch(q){
  const box = $('search-results'); q = q.trim().toLowerCase();
  if(!q){ box.classList.remove('open'); return; }
  const seen = new Set();
  srList = searchIndex().filter(x => (x.name + x.kind).toLowerCase().includes(q)).filter(x => { const k = x.kind + x.name; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0, 12);
  srFocus = -1;
  box.innerHTML = srList.length ? srList.map((x,i) => (!x.action && !isLive(x.url))
      ? `<div class="sr-item sr-off"><span class="sr-kind">${esc(x.kind)}</span><span><div class="sr-name">${esc(x.name)}</div><div class="sr-sub">整備中</div></span></div>`
      : `<a class="sr-item" data-i="${i}" href="${x.action ? '#' : esc(safeUrl(x.url))}" ${x.action ? '' : 'target="_blank" rel="noopener"'}>
      <span class="sr-kind">${esc(x.kind)}</span><span><div class="sr-name">${esc(x.name)}</div><div class="sr-sub">${esc(x.sub)}</div></span></a>`).join('')
    : `<div class="sr-empty">「${esc(q)}」に一致するものは見つかりませんでした。別の言葉で試すか、サイドバーのメニューから探してください。</div>`;
  box.querySelectorAll('[data-i]').forEach(a => a.onclick = e => { const x = srList[+a.dataset.i]; if(x.action === 'ann'){ e.preventDefault(); openModal('ann-modal'); } box.classList.remove('open'); });
  box.classList.add('open');
}
$('search-input').addEventListener('input', e => runSearch(e.target.value));
$('search-input').addEventListener('focus', e => runSearch(e.target.value));
$('search-input').addEventListener('keydown', e => {
  const items = $('search-results').querySelectorAll('a.sr-item');
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault(); if(!items.length) return;
    srFocus = (srFocus + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((it,i) => it.classList.toggle('focus', i === srFocus));
  } else if(e.key === 'Enter'){ e.preventDefault(); (items[srFocus] || items[0])?.click(); }
});
$('search-btn').onclick = () => { runSearch($('search-input').value); $('search-input').focus(); };
document.addEventListener('click', e => { if(!e.target.closest('.search-wrap')) $('search-results').classList.remove('open'); });
$('freq-chips').innerHTML = FREQ_WORDS.map(w => `<button>${esc(w)}</button>`).join('');
$('freq-chips').querySelectorAll('button').forEach(b => b.onclick = () => { $('search-input').value = b.textContent; runSearch(b.textContent); $('search-input').focus(); });

/* ───────── 入室パスワード ───────── */
const SESSION_KEY = 'mishima_portal_auth';
function sessionGet(){ try{ return sessionStorage.getItem(SESSION_KEY); }catch(e){ return null; } }
function unlock(){ $('lock').classList.add('hidden'); if(REMEMBER_LOGIN){ try{ sessionStorage.setItem(SESSION_KEY,'1'); }catch(e){} } }
function tryUnlock(){
  // 全角で入力された場合や前後の空白も許容する
  const v = ($('lock-input').value || '').normalize('NFKC').trim();
  if(v === PASS){ unlock(); return; }
  $('lock-error').classList.add('show'); $('lock-input').value = ''; $('lock-input').focus();
  setTimeout(() => $('lock-error').classList.remove('show'), 2200);
}
function lockNow(){
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
  $('lock-input').value = ''; $('lock').classList.remove('hidden'); closeMenu();
  setTimeout(() => $('lock-input').focus(), 50);
}
if(REMEMBER_LOGIN && sessionGet() === '1') unlock();
else { try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} $('lock').classList.remove('hidden'); setTimeout(() => $('lock-input').focus(), 50); }
$('lock-now').onclick = lockNow;
$('lock-btn').addEventListener('click', tryUnlock);
$('lock-input').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing) tryUnlock(); });

/* Ctrl（⌘）＋K で検索欄へ */
document.addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); $('search-input').focus(); $('search-input').select(); }
});

/* ホーム画面に追加したときの動作（旧ポータルから継続） */
if('serviceWorker' in navigator){
  addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

/* ───────── 起動 ───────── */
renderNav(); renderAnnouncements(); renderRoutine(); renderGoals();
renderTabs(); renderNews(); renderTools(); renderFavorites(); renderShortcuts(); renderTodos();
tick(); setInterval(tick, 15000);
fetchWeather(); setInterval(fetchWeather, 30*60*1000);
loadAllNews(); setInterval(loadAllNews, 30*60*1000);
</script>
